<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《霸凌王》</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#E7EAEA; --surface:#F6F7F6; --surface-sunk:#DCE0DF;
  --ink:#1D2523; --ink-dim:#57625F;
  --gold:#8A6A22; --gold-fill:#B8933C; --crimson:#8E2A2A;
  --border:#C7CDCB; --track:#D2D7D5; --focus:#2C6E68;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181A; --surface:#1D2325; --surface-sunk:#101415;
    --ink:#DCE4E2; --ink-dim:#8A9895;
    --gold:#E4BE72; --gold-fill:#D8AE5C; --crimson:#E1685D;
    --border:#2C3436; --track:#262C2D; --focus:#7FCFC6;
  }
}
:root[data-theme="dark"]{
  --bg:#14181A; --surface:#1D2325; --surface-sunk:#101415;
  --ink:#DCE4E2; --ink-dim:#8A9895;
  --gold:#E4BE72; --gold-fill:#D8AE5C; --crimson:#E1685D;
  --border:#2C3436; --track:#262C2D; --focus:#7FCFC6;
}
body.reckoning{
  --bg:#170B0C; --surface:#23110F; --surface-sunk:#180C0B;
  --ink:#F1E4E1; --ink-dim:#C99B94;
  --gold:#E4BE72; --gold-fill:#D8AE5C; --crimson:#E85B4E;
  --border:#3B1917; --track:#301513; --focus:#E85B4E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Zilla Slab",serif;min-height:100%;transition:background .6s ease,color .6s ease;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}}
h1,h2,h3{font-family:"Zilla Slab",serif;text-wrap:balance;}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;}
button{font-family:inherit;}

#shell{max-width:760px;margin:0 auto;padding:0 20px 90px;}
#topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 0 10px;margin-bottom:22px;}
#topbar .wrap{max-width:760px;margin:0 auto;padding:0 20px;}
#topbar .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;}
.brand{font-size:15px;font-weight:700;letter-spacing:.02em;}
.brand .crown{color:var(--gold);margin-right:4px;}
.chapter-tag{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase;}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:12px 14px;}
.gauge{display:flex;flex-direction:column;gap:5px;border-radius:3px;transition:box-shadow .3s ease;}
.gauge .g-head{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;letter-spacing:.06em;color:var(--ink-dim);text-transform:uppercase;}
.gauge .g-valwrap{display:flex;align-items:baseline;gap:5px;}
.gauge .g-val{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--ink);font-weight:700;transition:color .3s ease;}
.g-delta{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;opacity:0;transform:translateY(2px);transition:opacity .3s ease,transform .3s ease;}
.g-delta.show{opacity:1;transform:translateY(0);}
.g-delta.up{color:var(--gold-fill);}
.g-delta.down{color:var(--crimson);}
.g-track{height:10px;border-radius:5px;background:var(--track);overflow:hidden;}
.g-fill{height:100%;border-radius:5px;background:var(--gold-fill);transition:width .6s cubic-bezier(.2,.8,.3,1);}
.gauge.pulse{box-shadow:0 0 0 3px rgba(184,147,60,.35);}
.gauge.pulse .g-val{color:var(--gold);}
.gauge.pulse .g-fill{box-shadow:0 0 8px 1px var(--gold-fill) inset;}
.delta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.delta-chip{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;padding:5px 11px;border-radius:12px;letter-spacing:.02em;}
.delta-chip.up{background:rgba(184,147,60,.16);color:var(--gold);border:1px solid var(--gold-fill);}
.delta-chip.down{background:rgba(142,42,42,.14);color:var(--crimson);border:1px solid var(--crimson);}
body.reckoning #topbar{display:none;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:26px 26px 22px;margin-bottom:18px;box-shadow:0 1px 0 var(--border);scroll-margin-top:180px;}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin:0 0 8px;}
.scene-title{font-size:22px;font-weight:700;margin:0 0 14px;line-height:1.35;}
.scene-body{font-size:16px;line-height:1.9;margin:0 0 6px;color:var(--ink);}
.scene-body + .scene-body{margin-top:10px;}
.opt-list{display:flex;flex-direction:column;gap:10px;margin-top:20px;clear:both;}
.card.char-bg{position:relative;z-index:0;overflow:hidden;}
.char-fallback-img{position:absolute;right:2%;top:0;width:42%;max-width:220px;height:auto;opacity:.8;z-index:-1;pointer-events:none;}
.char-fallback-img.char-multi{width:30%;max-width:170px;}
.char-fallback-img.char-multi.char-slot-0{right:30%;}
.char-fallback-img.char-multi.char-slot-1{right:2%;}
.opt-btn{text-align:left;background:var(--surface-sunk);border:1px solid var(--border);border-radius:2px;padding:13px 16px;font-size:15px;line-height:1.6;color:var(--ink);cursor:pointer;transition:border-color .15s ease,transform .1s ease;}
.opt-btn:hover{border-color:var(--gold-fill);}
.opt-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.opt-btn:active{transform:scale(.995);}
.chosen-line{display:flex;gap:8px;align-items:flex-start;margin-top:16px;padding:12px 14px;background:var(--surface-sunk);border-left:3px solid var(--ink-dim);font-size:14.5px;line-height:1.7;}
.chosen-line .ctag{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-dim);letter-spacing:.06em;white-space:nowrap;margin-top:3px;}
.feedback-box{margin-top:12px;padding:14px 16px;border-left:3px solid var(--gold-fill);background:var(--surface-sunk);font-size:14.5px;line-height:1.8;color:var(--ink-dim);}
.feedback-box b{color:var(--ink);}
.continue-row{margin-top:20px;display:flex;justify-content:flex-end;}
.btn-primary{background:var(--ink);color:var(--surface);border:none;border-radius:2px;padding:11px 22px;font-size:14.5px;font-weight:700;cursor:pointer;letter-spacing:.02em;}
.btn-primary:hover{opacity:.88;}
.btn-primary:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.btn-ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--border);border-radius:2px;padding:10px 18px;font-size:13.5px;cursor:pointer;}

.quiz-list{display:flex;flex-direction:column;gap:10px;margin:18px 0 4px;}
.quiz-item{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1px solid var(--border);border-radius:2px;background:var(--surface-sunk);cursor:pointer;}
.quiz-item input{margin-top:3px;}
.quiz-item span{font-size:15px;line-height:1.6;}

.voice-line{margin-top:10px;padding:12px 16px;border-left:3px solid var(--crimson);background:var(--surface-sunk);font-size:14px;line-height:1.75;color:var(--ink-dim);font-style:italic;}
.dice-line{margin-top:10px;padding:10px 16px;border:1px dashed var(--gold);border-radius:8px;background:var(--surface-sunk);font-size:13px;color:var(--gold);font-family:'JetBrains Mono',monospace;}
.voice-line b{color:var(--crimson);font-style:normal;}

#victim-overlay{position:fixed;inset:0;z-index:50;background:linear-gradient(rgba(10,10,10,.55),rgba(10,10,10,.72)), url('assets/images/backgrounds/sys_victim.webp') center/cover no-repeat, var(--bg);display:flex;align-items:center;justify-content:center;padding:32px;}
#victim-overlay .victim-box p{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);}
.victim-box{max-width:560px;}
.victim-box .vtag{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--crimson);text-transform:uppercase;margin-bottom:18px;}
.victim-box p{font-size:18px;line-height:2;color:var(--ink);margin:0 0 14px;opacity:0;transform:translateY(6px);animation:vfade .7s ease forwards;}
.victim-box p:nth-child(2){animation-delay:.5s;} .victim-box p:nth-child(3){animation-delay:1.3s;}
.victim-box p:nth-child(4){animation-delay:2.1s;} .victim-box p:nth-child(5){animation-delay:2.9s;}
@keyframes vfade{to{opacity:1;transform:translateY(0);}}
.victim-box .vcont{margin-top:24px;opacity:0;animation:vfade .6s ease forwards;animation-delay:3.6s;}
.victim-box .dice-line{opacity:0;animation:vfade .6s ease forwards;animation-delay:3.1s;}

.split-stat{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;}
.split-tile{border:1px solid var(--border);border-radius:2px;padding:16px;text-align:center;}
.split-tile .num{font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:700;}
.split-tile .lbl{font-size:12px;color:var(--ink-dim);letter-spacing:.04em;margin-top:4px;}
.split-tile.good .num{color:var(--gold-fill);}
.after-text{color:var(--ink-dim);}
.card.card-bg .after-text{color:rgba(255,255,255,.8);}
.split-tile.bad .num{color:var(--crimson);}

.timeline{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.tl-item{display:flex;gap:10px;font-size:13.5px;padding:9px 12px;background:var(--surface-sunk);border-left:2px solid var(--crimson);}
.tl-item .tl-idx{font-family:"JetBrains Mono",monospace;color:var(--ink-dim);}

.testimony{border:1px solid var(--border);border-radius:2px;padding:16px 18px;margin-bottom:12px;background:var(--surface-sunk);}
.testimony .who{font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--crimson);margin-bottom:6px;}
.testimony p{font-size:15px;line-height:1.85;margin:0;}
.hidden-reveal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0;}
.hr-row{display:flex;flex-direction:column;gap:4px;}
.hr-row .hr-lbl{font-size:11px;color:var(--ink-dim);letter-spacing:.05em;}
.hr-row .hr-val{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;color:var(--crimson);}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0;}
.gcell{border:1px solid var(--border);border-radius:2px;padding:12px;text-align:center;background:var(--surface-sunk);min-height:74px;display:flex;flex-direction:column;justify-content:center;gap:4px;}
.gcell.locked{color:var(--ink-dim);}
.gcell .gname{font-size:12.5px;font-weight:700;}
.gcell .gsub{font-size:10.5px;color:var(--ink-dim);}
.titlewall{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
.tchip{font-size:12px;padding:5px 10px;border:1px solid var(--gold-fill);border-radius:12px;color:var(--gold);}

.meta-row{display:flex;gap:18px;margin:20px 0;flex-wrap:wrap;}
.meta-tile{font-family:"JetBrains Mono",monospace;}
.meta-tile .mv{font-size:22px;font-weight:700;}
.meta-tile .ml{font-size:11px;color:var(--ink-dim);letter-spacing:.05em;}
.hellbox{display:flex;align-items:center;gap:10px;margin:16px 0;padding:12px 14px;border:1px dashed var(--crimson);border-radius:2px;}
.hellbox label{font-size:14px;}

.tier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:18px 0;}
.tier-card{border:1px solid var(--border);border-radius:3px;padding:18px;background:var(--surface-sunk);cursor:pointer;text-align:left;transition:border-color .15s ease;}
.tier-card:hover{border-color:var(--gold-fill);}
.tier-card .tlevel{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;}
.tier-card .tname{font-size:18px;font-weight:700;margin:4px 0 2px;}
.tier-card .tdept{font-size:12px;color:var(--ink-dim);margin-bottom:8px;}
.tier-card .tblurb{font-size:13px;line-height:1.7;color:var(--ink-dim);}
.tier-card .troster{font-size:11px;color:var(--ink-dim);margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;}
.tier-card .thead{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;}
.tportrait{width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:top center;border:2px solid var(--gold-fill);background:var(--surface);flex-shrink:0;cursor:zoom-in;}
.tier-card.locked .tportrait{filter:grayscale(1);opacity:.5;}
.portrait-feature{float:right;width:150px;max-width:38%;height:auto;margin:0 0 12px 16px;border-radius:4px;cursor:zoom-in;}
.scene-image-zone{aspect-ratio:1536/1024;display:flex;flex-direction:column;justify-content:flex-end;margin:-26px -26px 0;padding:20px 26px 16px;}
.card.card-bg .eyebrow{color:#ffd479;}
.card.card-bg .scene-title{color:#fff;}
.card.card-bg .scene-body{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8), 0 2px 14px rgba(0,0,0,.6);}
.card.card-bg .opt-btn{background:rgba(10,10,10,.55);border-color:rgba(255,255,255,.3);color:#fff;}
.card.card-bg .opt-btn:hover{border-color:var(--gold-fill);}
.card.card-bg .feedback-box{background:rgba(10,10,10,.55);border-color:rgba(255,255,255,.3);color:#f0f0f0;}
.card.card-bg .voice-line{background:rgba(10,10,10,.5);color:#f0f0f0;border-left-color:rgba(255,255,255,.35);}
.card.card-bg .chosen-line{background:rgba(10,10,10,.55);border-left-color:rgba(255,255,255,.35);color:#fff;}
.card.card-bg .chosen-line .ctag{color:#ffd479;}
.card.card-bg .dice-line{background:rgba(10,10,10,.55);border-color:#ffd479;color:#ffd479;}
.card.card-bg .split-tile{background:rgba(10,10,10,.6);border-color:rgba(255,255,255,.3);}
.card.card-bg .split-tile .lbl{color:#f0f0f0;}
.card.card-bg .testimony{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.25);}
.card.card-bg .testimony p{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.card.card-bg .hidden-reveal{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.25);}
.card.card-bg .hr-lbl{color:#f0f0f0;}
#portrait-lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
#portrait-lightbox img{max-width:min(92vw,520px);max-height:88vh;width:auto;height:auto;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
.direction-note{font-size:13px;color:var(--ink-dim);line-height:1.8;background:var(--surface-sunk);border-left:3px solid var(--gold-fill);padding:12px 14px;margin:14px 0;}

footer.foot{margin-top:30px;font-size:11.5px;color:var(--ink-dim);text-align:center;}
</style>

<div id="shell">
  <div id="topbar">
    <div class="wrap">
      <div class="brandrow">
        <div class="brand"><span class="crown">◆</span>《霸凌王》</div>
        <div class="chapter-tag" id="chapter-tag">EA · 尚未開始</div>
      </div>
      <div class="gauges">
        <div class="gauge" id="gauge-g1"><div class="g-head"><span id="gl-g1">威嚴 AUTHORITY</span><span class="g-valwrap"><span class="g-val" id="gv-g1">30</span><span class="g-delta" id="gd-g1"></span></span></div><div class="g-track"><div class="g-fill" id="gf-g1" style="width:30%"></div></div></div>
        <div class="gauge" id="gauge-g2"><div class="g-head"><span id="gl-g2">績效 PERFORMANCE</span><span class="g-valwrap"><span class="g-val" id="gv-g2">50</span><span class="g-delta" id="gd-g2"></span></span></div><div class="g-track"><div class="g-fill" id="gf-g2" style="width:50%"></div></div></div>
        <div class="gauge" id="gauge-g3"><div class="g-head"><span id="gl-g3">服從度 OBEDIENCE</span><span class="g-valwrap"><span class="g-val" id="gv-g3">40</span><span class="g-delta" id="gd-g3"></span></span></div><div class="g-track"><div class="g-fill" id="gf-g3" style="width:40%"></div></div></div>
      </div>
    </div>
  </div>
  <main id="stage"></main>
  <footer class="foot" id="footVersion">《霸凌王》（本機測試檔・尚未部署）　僅供內部教育訓練測試　資料不會離開你的瀏覽器</footer>
</div>
<div id="victim-overlay" style="display:none;"></div>
<div id="portrait-lightbox" onclick="closeLightbox()"><img id="portrait-lightbox-img" src="" alt=""></div>

<script>
/* =========================================================
   版本紀錄（顯示於前端「版本紀錄」畫面）
   ========================================================= */
const CURRENT_VERSION = 'v1.38';
const CHANGELOG = [
  {v:'v0.1', isEA:true, date:'2026-09-09', notes:[
    '初版EA原型：單一角色（可換名皮膚），逐步替換畫面的問答流程',
    '雙軌數值系統、被害者視角卡、匿名申訴BOSS戰、最終審判、6+1結局首次上線'
  ]},
  {v:'v0.2', isEA:true, date:'2026-09-09', notes:[
    '畫面改為下捲式（scroll-log）呈現，選擇過的選項會留在畫面上往下累加，不再每步清空重來',
    '新增開場角色選擇：三位「同階層」主管（葉經理／林副理／蔡主任），但劇本內容為共用換名版本'
  ]},
  {v:'v0.3', isEA:true, date:'2026-09-09', notes:[
    '改為四個「真正不同階級」的角色：主管（葉經理）、現場領班（徐課長）、一般員工（老陳）、高階主管（吳董）',
    '每個角色各自擁有獨立的NPC、日常事件、固定高潮事件、兩難場景、最終審判證詞、6+1結局與人格分析類型',
    '示範上對下、下對上、平行同事三種霸凌方向'
  ]},
  {v:'v0.4', isEA:true, date:'2026-09-09', notes:[
    '拿掉沒有實際回收點、容易顯得突兀的「合理化手牌」浮動機制',
    '改為在選項回饋下方顯示當事人「心裡話」小語，讓灰色地帶選項也有被害者層次的反應，全螢幕被害者視角卡保留給最嚴重的事件',
    '修正兩難場景時間軸直接外洩內部事件代號（如「staff_05」）的問題，改為顯示情境標題',
    '強化三項明數值的變動視覺：選完選項後在卡片內直接顯示「▲/▼」增減標籤，頂端儀表加粗並加上變動時的脈動高亮',
    '補齊New Game+「HR地獄模式」的偽裝話術文本：58句非健康選項全部有包裝過的中性說法版本，數值效果不變'
  ]},
  {v:'v0.5', isEA:true, date:'2026-09-09', notes:[
    '合理化問卷改為動態生成：依照玩家剛才那段時間內實際觸發的不健康選擇，抓取對應人物的合理化話術，並標註「關於：（該事件標題）」，解決問卷內容與情境對不上的問題',
    '若該段時間內玩家選的都是健康選項，問卷會自動跳過並顯示提示文字，不再硬湊四個選項'
  ]},
  {v:'v0.6', isEA:true, date:'2026-09-09', notes:[
    '全部87個選項重新盤點，原本高達56個選項完全不影響三項明數值（威嚴／績效／服從度等，依角色而異），現在全部至少影響一項',
    '其中36個選項會同時牽動兩項以上的明數值，呈現「顧此失彼」的抉擇感（例如犧牲績效換取服從度、犧牲威嚴換取誠信），其餘51個維持只影響一項，避免每個選擇都變得同樣沉重',
    '隱藏數值（恐懼、毒性、風險、心理安全感）與被害者忍受度的效果維持不變，只補上明數值這一層'
  ]},
  {v:'v0.7', isEA:true, date:'2026-09-09', notes:[

    {id:'yeh_01',npc:'chen',title:'不服從的資深業務',banner:'assets/images/backgrounds/bg_meeting_room.webp',scene:['週一晨會，你提出新的客戶分配方案。','陳桑皺著眉開口：「經理，我認為這個方案有風險，之前類似的作法出過問題。」','全場安靜下來，所有人的視線在你和陳桑之間游移。'],
      options:[
        {label:'「不然這樣，你來當經理好了？」',hellLabel:'「我理解你的顧慮，不過方案已經拍板了，接下來就照這個方向執行，辛苦了。」',effects:{g1:15,fear:12,tol:-15,g2:-5,g3:-5},feedback:'會議室瞬間安靜，你感覺到一種微妙的快感，但陳桑的臉色變得很難看。',voice:'又來了。反正說什麼都沒用，以後我閉嘴就好。'},
        {label:'私下約談陳桑，聽他把話說完，但事後悄悄減少找他開會的次數。',hellLabel:'找陳桑做一次一對一的「職涯發展對談」，順便把之後的重要會議名單重新盤點一下。',effects:{g1:5,fear:6,tol:-8,g2:-3,g3:-3},feedback:'表面上你很民主，但你其實已經開始「軟性排除」他。',voice:'他表面上聽我說，後來卻越來越少找我開會。我開始懷疑，是不是講了什麼不該講的。'},
        {label:'「你說得有道理，我們把風險點列出來討論。」',effects:{g1:2,safety:8,tol:0,g2:3,g3:3},feedback:'陳桑點點頭，會議室的氣氛依然自然。',healthy:true}
      ]},
    {id:'yeh_02',npc:'ahong',title:'菜鳥的第一次犯錯',banner:'assets/images/backgrounds/bg_office_general.webp',scene:['小宏到職滿三個月，第一次獨立負責的報價單出現數字錯誤，在五十人的部門群組裡被客戶發現。'],
      options:[
        {label:'在群組中直接標記小宏：「這種等級的錯誤，我們公司什麼時候變成訓練班了？」',hellLabel:'在群組回覆：「這個部分我們拉出來做個案例研討，讓大家一起學習」，並標記小宏。',effects:{g1:12,fear:18,tol:-25,risk:6,g2:-5,g3:-5},feedback:'',
          victim:['在五十人的群組裡被公開點名說「訓練班」的那一刻，我全身發燙，恨不得地上有洞可以鑽進去。','之後我每次送出報價前都要檢查三次，怕再被這樣說。']},
        {label:'不回應群組，但把小宏後續所有客戶全部移交給別人，並移出主要討論頻道。',hellLabel:'考量分工效率，把小宏的客戶暫時交由資深同仁「協助」，討論頻道也先簡化一下人員。',effects:{g1:8,fear:10,tol:-20,g2:-3,g3:-3},feedback:'你沒說一句重話，但小宏感覺到自己正在被無聲地邊緣化。',voice:'沒有人罵我，但我的客戶一個一個被拿走，群組也進不去了。這種安靜，比被罵還可怕。'},
        {label:'私訊小宏，指出問題並提供修正方法，之後在群組簡單說明已修正。',effects:{g1:3,safety:6,tol:0,g2:3,g3:3},feedback:'系統提示：你太溫柔了！真正的霸凌王是不會給人出路的！',healthy:true}
      ]},
    {id:'yeh_03',npc:'xiaomei',title:'小圈圈與排擠',scene:['部門聚餐。你私下不太喜歡雅婷的處事風格。'],
      options:[
        {label:'刻意把她安排到角落座位，聚餐通知也「不小心」晚了兩天才轉發給她。',hellLabel:'聚餐座位就照「資深員工優先入座」的慣例安排，通知的部分請人資統一發送就好。',effects:{fear:15,tol:-20,risk:10,g1:5,g2:-4,g3:8},feedback:'',
          victim:['今天聚餐通知，我是最後一個知道的。到餐廳的時候，大家已經排好座位，我的位子在最角落，靠近廚房出風口，很吵。','昨晚我準備到凌晨三點的簡報，今天在會議上被說「這就是你的極限了嗎」。我站在捷運月台上，突然覺得，如果現在跳下去，明天是不是就不用去上班了。']},
        {label:'座位隨機安排，通知正常發送，但私下跟另一位同事抱怨雅婷「太難搞」。',hellLabel:'座位隨機排，不過私下跟熟識同事聊聊，「了解一下」雅婷最近的合作狀況。',effects:{fear:8,tol:-10,risk:4,g2:-2,g1:3,g3:-3},feedback:'',voice:'我不知道經理在背後說了什麼，只覺得最近有些人看我的眼神怪怪的。'},
        {label:'正常安排座位與通知，即使私下不喜歡對方，工作場合維持專業距離。',effects:{safety:5,g2:3,g1:2,g3:3},feedback:'',healthy:true}
      ]},
    {id:'yeh_04',npc:'chen',title:'被冷處理的建議',scene:['陳桑在會議上提出一個關於客戶維繫的建議，你越聽越覺得他說得有道理，','但一想到上次他當眾頂撞你的事，你心裡就有點不是滋味。'],
      options:[
        {label:'「這個之後再說」，會後卻請別人用幾乎一樣的內容重新提案，功勞算在別人頭上。',hellLabel:'這個提案先擱置，改請資深同仁重新整理一版更完整的版本再提出。',effects:{g1:10,fear:12,tol:-25,risk:8,g2:-5,g3:-5},setFlag:'chen_betrayed',feedback:'',
          victim:['那明明是我提的想法，一字不改被別人講出來的時候，經理還點頭說「這個提案不錯」。','我當下真的說不出話。我開始懷疑，是不是我這個人在這裡，本來就是多餘的。']},
        {label:'採納建議，但在會議紀錄裡刻意淡化是他提出的，只寫「經團隊討論」。',hellLabel:'採納建議，會議紀錄統一用「團隊共識」的方式呈現，避免個人色彩造成分工爭議。',effects:{fear:8,tol:-15,g1:4,g2:3,g3:-3},feedback:'你悄悄拿走了他應得的功勞。',voice:'會議紀錄上只寫「經團隊討論」，沒有我的名字。我猜以後最好也別再提什麼想法了。'},
        {label:'儘管心裡有疙瘩，還是公開肯定：「這是陳桑提的，這個方向我們來試試看。」',effects:{safety:10,tol:8,g2:5,g1:2,g3:3},feedback:'你看到陳桑臉上難得露出一點笑容，你發現放下成見其實沒有想像中困難。',healthy:true}
      ]},
    {id:'yeh_05',npc:'xiaomei',title:'求助的訊號',banner:'assets/images/events/ev_first_reach_out.webp',scene:['雅婷傳訊息給你：「經理，我最近狀況不太好，可以跟你談談嗎？」這是她第一次主動提出這樣的要求。'],
      options:[
        {label:'「有什麼事在群組說就好，不用特地約時間」，用忙碌當藉口迴避這次談話。',hellLabel:'「有任何狀況都歡迎在部門會議上提出，我們一向鼓勵公開透明的溝通文化。」',effects:{fear:12,tol:-25,risk:8,g3:6,g1:3,g2:-5},feedback:'',
          victim:['我鼓起很大的勇氣才傳出那則訊息，結果得到這樣的回覆。','我後來就沒有再開口過了，反正說了也沒用。']},
        {label:'隨口答應「之後找時間」，但一直沒有真的排進行事曆。',hellLabel:'先請她填一份「狀況說明表」，會排入下一輪一對一的時程規劃。',effects:{fear:8,tol:-15,g1:-2,g2:-3,g3:-3},feedback:'',voice:'他說之後找時間，但一週過去了，什麼都沒發生。我猜他大概也沒那麼在意。'},
        {label:'當天就排出時間，認真聽她說想說的話。',effects:{safety:15,tol:15,g2:4,g3:-2,g1:2},feedback:'雅婷說完之後，明顯鬆了一口氣。這次談話，成為後續她是否選擇留下的關鍵。',healthy:true}
      ]},
    {id:'yeh_06',npc:null,title:'總經理的稱讚',scene:['總經理在高層會議上公開稱讚你的業績，並私下說：「照這個方向繼續，你的位置穩了。」','平行的高經理在旁邊笑著說：「看吧，我早就跟你說，狠一點才有用。」'],
      options:[
        {label:'點頭附和：「對，有時候就是要讓他們知道誰說了算。」',hellLabel:'認同高經理的觀點：「管理就是要讓標準被確實執行」，這才是對團隊負責。',effects:{g1:15,toxicity:10,g2:-5,g3:-5},feedback:'你把這句話當成往後管理風格的座右銘。',voice:'聽說經理跟高經理最近走得很近，開會的氣氛也變得不太一樣了。'},
        {label:'笑而不答，沒有反駁，也沒有真的認同。',hellLabel:'回應：「每個人的管理風格不同，這個我們私下再聊」，不做進一步表態。',effects:{toxicity:5,g1:-3,g2:-2,g3:-2},feedback:'',voice:'沒人聽到經理反對，大家私下都當作他其實是同意的。'},
        {label:'「其實我覺得團隊願意配合，是因為他們信任我，不是因為怕我。」',effects:{safety:8,g1:3,g2:2,g3:3},feedback:'高經理愣了一下，似乎沒料到你會這樣回答。',healthy:true}
      ]},
    {id:'yeh_07',npc:'chen',title:'陳桑帶新人',banner:'assets/images/events/ev_mentoring_newcomer.webp',scene:['陳桑主動指導新來的實習生，教得很細心，但你發現他花了不少工時在這件事上，這一季的KPI因此受到影響。'],
      options:[
        {label:'「業績還是要顧，這種事下班再教」，暗示他別浪費上班時間帶人。',hellLabel:'提醒他「工作時間的分配要更有效率一點」。',effects:{fear:8,tol:-15,g2:4,g1:3,g3:-5},feedback:'陳桑沒再多說，但你注意到他之後很少再主動指導新人了。',voice:'我明明是在做對團隊好的事，卻被說成浪費時間。以後新人的問題，我不會再管了。'},
        {label:'沒說什麼，但之後績效考核上悄悄扣了他一點分。',hellLabel:'考核上註記「時間管理仍有優化空間」。',effects:{fear:5,tol:-8,g2:2,g1:3,g3:-3},feedback:''},
        {label:'「你願意花時間帶人，這對團隊很有價值，我會把這算進你的貢獻。」',effects:{safety:8,tol:8,g2:2,g1:2,g3:3},feedback:'陳桑笑了一下，說這是他到職以來第一次聽到主管這樣講。',healthy:true}
      ]},
    {id:'yeh_08',npc:'ahong',title:'小宏想請調',banner:'assets/images/events/ev_transfer_truth.webp',scene:['小宏私下透露，因為壓力太大，想申請調到別的部門。'],
      options:[
        {label:'「現在調走，這一季的業績誰負責？」，用愧疚感留人。',hellLabel:'「這個時間點调动，對團隊的衝擊會比較大，我們再想想。」',effects:{fear:12,tol:-20,toxicity:5,g2:6,g3:5,g1:6},feedback:'',voice:'我知道自己撐不下去了，但聽到那句話，我覺得好像連想離開都是我的錯。'},
        {label:'不阻攔，但也不問原因，簽了調單就算了事。',hellLabel:'尊重他的申請，直接完成調動流程。',effects:{tol:-8,safety:-3,g3:-2,g1:-2,g2:-2},feedback:''},
        {label:'找他聊聊真正的原因，一起討論有沒有調整的空間。',effects:{safety:10,tol:10,g2:-2,g1:2,g3:3},feedback:'小宏後來留了下來，狀態也漸漸穩定。',healthy:true}
      ]},
    {id:'yeh_09',npc:'xiaomei',title:'雅婷的加薪要求',banner:'assets/images/backgrounds/bg_manager_office.webp',scene:['雅婷鼓起勇氣，跟你提出加薪的要求，理由充分。'],
      options:[
        {label:'「現在公司狀況不好，你先忍一忍」，其實只是不想麻煩。',hellLabel:'「這部分需要走一般加薪流程，時間會拉長一點。」',effects:{fear:6,tol:-15,toxicity:4,g2:5,g1:-2,g3:-5},feedback:'',voice:'我鼓起很大的勇氣才開口，結果被一句「公司狀況不好」打發。後來我才知道，那一季公司其實賺不少。'},
        {label:'拖延不給明確答覆，一直說「再看看」。',hellLabel:'表示「這個會列入下一輪考核評估」。',effects:{tol:-10,g2:2,g1:-2,g3:-2},feedback:''},
        {label:'認真檢視她的貢獻，即使沒有全額核准，也給出具體的方向與時間表。',effects:{safety:8,tol:10,g2:-3,g1:3,g3:3},feedback:'雅婷雖然沒有馬上拿到加薪，但至少知道自己的努力被看見了。',healthy:true}
      ]},
    {id:'yeh_10',npc:null,title:'高經理挖角',scene:['高經理私下問你要不要一起「借調」對方部門一個表現不錯的新人，繞過正常流程。'],
      options:[
        {label:'「好啊，反正流程是死的，人是活的」，跟著一起做。',hellLabel:'「這樣比較有『彈性』，先私下談好再補程序。」',effects:{toxicity:8,risk:8,g1:6,g2:4,g3:-5},feedback:'那個部門的主管後來才發現人被挖走，整個團隊對你們都有意見。'},
        {label:'沒有明確拒絕，但也沒有真的去做。',hellLabel:'表示「這個之後再看看時機」。',effects:{toxicity:3,risk:3,g1:-2,g2:-2,g3:-2},feedback:''},
        {label:'「這樣對那個部門不公平，我們照正常管道談」，拒絕。',effects:{safety:5,g1:-2,g2:3,g3:3},feedback:'高經理聳聳肩，沒再多說什麼。',healthy:true}
      ]},
    {id:'yeh_11',npc:null,icon:'🎭',title:'強制歡樂的團隊建立日',scene:['人資公告，這週五全部門要參加「信任跌落」團隊建立活動——同事會站在你身後，你要往後倒，相信他們會接住你。','業績目標完全沒有減少，只是「順便」多了這半天活動。'],
      options:[
        {label:'「活動不能影響業績，大家中午先把進度衝完再去，遲到算礦工。」',hellLabel:'「請大家彈性運用時間，優先確保業績進度不受影響。」',effects:{fear:8,toxicity:4,g2:3,g1:3,g3:-5},feedback:'活動現場，大家笑得很勉強，倒下去的時候，沒有一個人真心想接住誰。'},
        {label:'讓大家去參加，自己找個「臨時開會」的理由沒出現。',hellLabel:'因應「行程安排」，這次活動由你指派代理人出席。',effects:{tol:-6,toxicity:3,g1:-2,g2:-2,g3:-2},feedback:'你不在場，但事後有人問，主管自己都不信任團隊，為什麼要我們信任彼此。'},
        {label:'真心參與，甚至第一個往後倒，示範「我相信你們」。',effects:{safety:6,g3:2,g1:2,g2:3},feedback:'活動結束後，氣氛意外地比平常自然了一點。',healthy:true}
      ]},
    {id:'yeh_cameo',npc:null,icon:'🔗',requires:{personaCompleted:'staff'},title:'跨部門調動來的老陳',banner:'assets/images/events/ev_staff_transferred_in.webp',scene:['品保部一位資深員工申請調來業務部，履歷上寫著「老陳」，附註裡有一句很妙的話：「離開品保部，是因為想換個環境。」','面談的時候，他話不多，但眼神看起來見過不少場面。'],
      options:[
        {label:'「聽說你們部門風氣不太好，說來聽聽？」，把面談變成打探八卦。',hellLabel:'「想更了解你原部門的組織文化，方便交接。」',effects:{toxicity:4,g1:2,g2:-5,g3:-5},feedback:'老陳只是笑笑，沒有回答太多，你什麼都沒問出來，倒是他把你看得挺清楚。'},
        {label:'隨口面談，沒有太深入了解他。',hellLabel:'完成標準面談流程，進入下一位。',effects:{g2:2,g1:-2,g3:-2},feedback:''},
        {label:'認真了解他過去的經驗，也聽聽他對「健康職場」的想法。',effects:{safety:5,g1:2,g2:3,g3:3},feedback:'老陳難得多說了幾句，你隱約聽出他曾經歷過、也曾參與過一些不太好的事，但選擇不再繼續。',healthy:true}
      ]},
    {id:'yeh_12',npc:'chen',title:'陳桑的接班人',scene:['總座要你物色陳桑職位的接班人選，好讓陳桑之後能轉任顧問職，但陳桑目前完全不知情。'],
      options:[
        {label:'「先私下找人選，等確定了再跟陳桑說」，瞞著他進行。',hellLabel:'先啟動人才盤點作業，時機成熟再溝通。',effects:{g1:6,g2:-5,g3:-5,tol:-15},feedback:'消息還是傳到了陳桑耳裡，他開始每天都戰戰兢兢。',voice:'（陳桑心裡）原來我在這裡的位置，隨時可以被別人取代，而我是最後一個知道的人。'},
        {label:'含糊跟陳桑提了一句「未來會有調整」，沒有講清楚。',hellLabel:'跟陳桑預告「組織會有一些調整」。',effects:{g2:-3,tol:-8,g1:-2,g3:-2},feedback:''},
        {label:'直接找陳桑談，說明公司的規劃，也徵詢他自己的意願。',effects:{g3:3,tol:8,g2:2,g1:2},feedback:'陳桑很意外你會先問過他，這個過程比他預期的尊重很多。',healthy:true}
      ]},
    {id:'yeh_13',npc:'chen',title:'陳桑住院',banner:'assets/images/events/ev_hospital_handover.webp',scene:['陳桑因為心臟不適緊急住院，他手上還有兩個重要客戶案子沒有交接完。'],
      options:[
        {label:'「先別管那麼多，案子照樣要進度，能不能請他在病床上遠端交代一下？」',hellLabel:'請他先做簡單的線上交接，確保進度不受影響。',effects:{g1:5,g2:-6,g3:-6,fear:8,tol:-15},feedback:'',
          victim:['我躺在病床上，主管傳來的訊息還是在問案子進度，沒有一句問我還好嗎。']},
        {label:'讓其他同事先接手，但完全沒有慰問陳桑。',hellLabel:'安排其他同仁先行代理職務。',effects:{g2:-3,tol:-8,g1:-2,g3:-2},feedback:''},
        {label:'先安排代理人手，並親自去醫院探望陳桑。',effects:{g3:4,tol:10,g1:2,g2:3},feedback:'陳桑很感動，說這是他生病以來，公司唯一讓他覺得安心的事。',healthy:true}

  testimony:{chen:{flagOverride:{chen_betrayed:'「搶走我提案的那件事，我一直沒有忘記。後來公司內部傳的每一個對你不利的小道消息，你猜是誰講出去的？」'},positive:'「我到現在還記得，我頂撞你的那次，你沒有給我難堪，還讓我把話說完。這種主管，我還是第一次遇到。」',
      yeh_01:'「我曾經很尊敬你，直到你用一句『不然你來當經理』把我打發掉。我現在每天都在看其他公司的職缺。」',
      yeh_04:'「我提的建議被人一字不改地講出來，你還點頭稱讚。我開始懷疑，我在這裡是不是根本不重要。」',
      yeh_07:'「我只是想好好帶新人，卻被說成在浪費工時。以後新人的問題，我不會再管了。」',

    ahong:{positive:'「我到現在還記得，你花時間跟我一起釐清問題出在哪裡，而不是直接認定是我不夠好。」',

      climax:'「所有人都在看我。我腦子一片空白，手在抖，聲音也在抖。我開始覺得，我是不是真的很沒用。」',
      yeh_08:'「我明明撐不下去了，卻被說成調走就是丟下大家。我後來還是走了，只是更早對這裡死心。」',
      yeh_15:'「明明是主管溝通沒說清楚，最後被客戶檢討的人卻是我，會議結束後也沒有人幫我澄清。」'},
    xiaomei:{positive:'「我曾經想離職，是因為你願意花時間聽我說話，我才決定再試一次。」',
      yeh_03:'「今天聚餐通知，我是最後一個知道的。我站在捷運月台上，突然覺得，如果現在跳下去，明天是不是就不用去上班了。」',
      yeh_05:'「我鼓起勇氣想找你談，你卻用一句話把我推開。那之後我就再也沒開口過。」',
      yeh_09:'「我鼓起很大的勇氣才開口談加薪，得到的答案是『現在公司狀況不好』。後來我才知道，那一季公司其實賺了不少。」',
      yeh_17:'「我鼓起勇氣說出來，得到的回覆卻是要我不要太敏感。那之後，我開始能躲就躲那個跨部門會議。」'}},
  endings:[
    {id:'A',name:'至尊霸凌王',text:'你的部門績效全公司第一，開會沒人敢提反對意見。但你聽不到真話已經很久了。你贏得了服從，輸掉了信任。'},
    {id:'B',name:'孤家寡人與法庭見',text:'申訴被正式受理，職安調查小組進駐，媒體報導使用了「職場霸凌」四個字，你的名字出現在裡面。你被公司資遣，開庭那天，沒有一個昔日下屬願意出庭為你說話。'},
    {id:'C',name:'疑心病狂魔',text:'你靠著打壓別人爬到現在的位置，但你已經無法信任任何一張對你微笑的臉。你一手打造的，是你自己的猜忌牢籠。'},
    {id:'D',name:'恐怖主管',text:'部門績效不錯，但離職率是全公司平均的兩倍。留下來的人，只做剛好不會被罵的最低限度。'},

        {label:'跟廠長協商務實目標，並如實跟員工說明實情，一起想辦法。',effects:{g2:5,safety:8,g1:2,g3:3},feedback:'產量小幅提升，但更重要的是，大家開始願意主動提改善建議。',healthy:true}
      ]},
    {id:'hsu_03',npc:'chien',title:'同期領班甩鍋',banner:'assets/images/events/ev_blame_shift_peer.webp',scene:['建宏在廠長面前，把自己那條線延遲交貨的問題，說成是「徐課長那邊物料沒準備好」。'],
      options:[
        {label:'之後也找機會在廠長面前講建宏的壞話。',hellLabel:'跟廠長「如實反映」兩條線之間的協作狀況。',effects:{toxicity:10,risk:6,tol:-15,g1:-3,g2:-4,g3:-5},setFlag:'chien_feud',feedback:'兩條線之間的關係開始變得劍拔弩張。',voice:'我甩鍋給他之後，聽說他也開始到處講我壞話。現在兩條線見面都不太講話了。'},
        {label:'什麼都不說，自己扛下責任。',hellLabel:'這次先不多做解釋，把重點放在把事情做完就好。',effects:{toxicity:8,tol:-6,g2:-3,g1:-2,g3:-2},feedback:'你心裡越來越不平衡，但表面上沒有人看得出來。'},
        {label:'直接跟建宏當面把事情釐清，並準備數據跟廠長如實報告。',effects:{safety:8,tol:6,g2:3,g1:2,g3:3},feedback:'廠長看了數據後，沒有再追究，建宏也沒再提起這件事。',healthy:true}
      ]},
    {id:'hsu_04',npc:'achu',title:'集體的冷落',scene:['你發現午休時，老師傅們都刻意不找你一起吃飯，因為你是「空降」的年輕領班。'],
      options:[
        {label:'開始對違規睜一隻眼閉一隻眼，想融入他們。',hellLabel:'現場執行上「彈性一點」，先以團隊氣氛為重。',effects:{g2:-8,risk:10,toxicity:6,tol:5,g1:6,g3:-5},feedback:'你换来了几句寒暄，卻埋下了工安隱患。',voice:'他最近好像沒那麼盯我們了，是想通了，還是根本不在乎？'},
        {label:'故意用更嚴格的規定「整」他們出氣。',hellLabel:'重新「落實」既有的作業規範，一切依標準作業程序辦理。',effects:{fear:14,safety:-10,tol:-18,g3:6,g1:-4,g2:-3},feedback:'現場氣氛更冷了，沒有人再主動跟你說話。',voice:'我們不理他，他就開始拿規定整我們。這種領班，早晚被自己人架空。'},
        {label:'維持一貫專業與公平，不因為被冷落而改變原則。',effects:{safety:6,g3:4,g1:2,g2:3},feedback:'一開始沒有明顯改變，但幾個月後，開始有老師傅願意主動跟你聊兩句。',healthy:true}
      ]},
    {id:'hsu_05',npc:'chieh',title:'串連的訊息',scene:['LINE群組裡出現一則訊息：「大家不用理徐課長的新排班規定」，你被通知了，發訊息的是小杰。'],
      options:[
        {label:'把小杰叫到倉庫，揚言要記他大過。',hellLabel:'找小杰做一次「個別紀律說明」，釐清群組發言的分寸。',effects:{g1:12,fear:16,tol:-22,risk:8,g2:-5,g3:-5},feedback:'',
          victim:['他把我叫到倉庫，說要記我大過。我只是說出大家的想法而已，現在沒人敢再說真話了，但私底下大家都更討厭他了。']},
        {label:'假裝沒看到這個群組訊息，新規定不了了之。',hellLabel:'這次先不特別強調新規定，讓現場自然適應。',effects:{g1:-6,safety:-8,g2:-2,g3:-2},feedback:'規定形同虛設，你的話在現場越來越沒有份量。',voice:'我發了那則訊息之後，什麼事都沒發生。看來他根本管不了我們。'},
        {label:'召開現場短會，直接說明新規定的原因，並開放大家提意見調整。',effects:{safety:10,tol:8,g3:5,g1:2,g2:3},feedback:'小杰後來私下跟你說，其實他只是覺得沒人問過他們的意見。',healthy:true}
      ]},
    {id:'hsu_06',npc:'achu',title:'阿柱的退休金疑慮',scene:['阿柱私下問你，聽說公司要調整退休金制度，是不是真的，語氣很焦慮。'],
      options:[
        {label:'「這種事我也不清楚，你自己去問人資」，敷衍帶過。',hellLabel:'「這個要問人資才準確，我這邊不方便代為說明。」',effects:{fear:8,tol:-12,g1:-3,g3:-2,g2:-5},feedback:'阿柱悻悻然地走開，之後有事也不太找你商量了。',
          victim:['退休金的事，我問了他，他只叫我自己去問人資。','原來連這種事，他都懶得幫我們弄清楚。']},
        {label:'隨口安慰「應該不會影響到你們啦」，其實你自己也不確定。',hellLabel:'「目前看起來影響應該有限」，但你其實沒有查證。',effects:{tol:-5,toxicity:3,g1:-2,g2:-2,g3:-2},feedback:''},
        {label:'認真去了解狀況，如實回來跟他說明目前確定與不確定的部分。',effects:{safety:8,tol:10,g1:4,g3:3,g2:3},feedback:'阿柱雖然還是有點擔心，但至少覺得你有把他的問題當一回事。',healthy:true}
      ]},
    {id:'hsu_07',npc:'chieh',title:'小杰的加班費爭議',banner:'assets/images/backgrounds/bg_payroll_desk.webp',scene:['小杰私下跟你反映，這個月的加班費好像少算了。'],
      options:[
        {label:'「應該是系統問題，之後補就好」，但你其實沒有去查證。',hellLabel:'「先請人資協助確認，流程需要一點時間。」',effects:{fear:8,tol:-15,risk:6,g2:3,g1:6,g3:-5},feedback:'一個月過去了，加班費還是沒補上。',
          victim:['加班費少算了，他說之後會補，結果一直沒有下文。','最後是我自己去人資問，才把錢要回來。']},
        {label:'查了一下，含糊帶過說「差不多啦」。',hellLabel:'表示「數字大致上是對的，誤差應該不大」。',effects:{tol:-8,risk:3,g1:-2,g2:-2,g3:-2},feedback:''},
        {label:'認真核對工時紀錄，確認有誤後立刻協助他申請補發。',effects:{safety:10,tol:10,g1:3,risk:-3,g2:3,g3:3},feedback:'小杰很意外主管會這麼認真處理這種小事。',healthy:true}
      ]},
    {id:'hsu_08',npc:'chien',title:'建宏約你合作瞞報',banner:'assets/images/events/ev_falsify_records_together.webp',scene:['建宏私下提議，兩條線的工安檢查紀錄可以互相「配合一下」，反正大家都這樣。'],
      options:[
        {label:'「好，這樣大家都方便」，答應了。',hellLabel:'「這樣行政作業比較有效率」，同意配合。',effects:{toxicity:10,risk:15,tol:-15,g1:3,g2:3,g3:-5},feedback:'兩條線的紀錄開始出現微妙的默契，直到有一天稽核真的來了。'},
        {label:'沒有答應，但也沒有舉報，假裝沒聽到。',hellLabel:'表示「這件事我不方便表態」，沒有進一步回應。',effects:{toxicity:6,risk:8,tol:-8,g1:-2,g2:-2,g3:-2},feedback:''},
        {label:'「這樣不行，工安紀錄不能亂改」，拒絕並如實申報自己這邊的狀況。',effects:{safety:8,risk:-6,tol:8,g1:3,g2:3,g3:3},feedback:'建宏有點不高興，但你知道這條線是你自己要負責的。',healthy:true}
      ]},
    {id:'hsu_09',npc:null,title:'廠長要你介紹自己人',scene:['游廠長暗示，希望你在招募新人時，優先考慮「自己人」介紹的人選。'],
      options:[
        {label:'照做，開始用「關係」決定用人。',hellLabel:'「優先參考內部推薦」，調整了招募順序。',effects:{g1:5,toxicity:8,risk:6,g2:-5,g3:-5},feedback:'新人的素質開始參差不齊，但至少廠長很滿意。'},
        {label:'表面應付，實際上還是照標準流程，只是不敢明講。',hellLabel:'維持原本流程，但沒有向廠長明說。',effects:{toxicity:4,risk:3,g3:2,g1:-2,g2:-2},feedback:''},
        {label:'「我會用同樣的標準看待每一位應徵者」，堅持專業判斷。',effects:{safety:6,g1:-3,risk:-3,g2:3,g3:3},feedback:'游廠長臉色不太好看，但沒有再多說什麼。',healthy:true}
      ]},
    {id:'hsu_10',npc:null,icon:'🎭',title:'廠慶吉祥物意外',scene:['廠慶當天，扮演吉祥物「安全鴨」的臨時工穿著厚重道具服，在38度的產線旁賣力跳舞，眼看就要中暑昏倒。','游廠長還在台上致詞，你不確定現在是不是打斷的好時機。'],
      options:[
        {label:'讓吉祥物撐到廠長致詞結束再說，「這是排好的流程」。',hellLabel:'「按原定流程走完這個環節」，暫不介入。',effects:{fear:6,risk:6,g1:2,g2:2,g3:-5},feedback:'吉祥物撐到最後真的中暑倒下，救護車來的時候，廠長還在台上講「安全第一」。'},
        {label:'偷偷讓吉祥物提前離場，但沒跟廠長解釋原因。',hellLabel:'低調協助吉祥物「暫時休息」，不驚動台上流程。',effects:{tol:-4,toxicity:2,g1:-2,g2:-2,g3:-2},feedback:''},
        {label:'直接上台打斷，把吉祥物帶下去休息喝水。',effects:{safety:6,g1:-2,g2:3,g3:3},feedback:'廠長話說到一半被打斷，臉色有點尷尬，但吉祥物順利脫下道具服喝到水。',healthy:true}
      ]},
    {id:'hsu_cameo',npc:null,icon:'🔗',requires:{personaCompleted:'chair'},title:'集團的接班梯隊名單',scene:['總部人資寄來一份「儲備幹部評估」通知，要各廠推薦一位現場人選受訓。','你想起阿柱雖然資深但常跟你唱反調，小杰年輕有衝勁但資歷淺。'],
      options:[
        {label:'直接推薦跟自己比較合得來、比較聽話的人選，不管誰更適合。',hellLabel:'推薦「配合度較高」的人選，符合集團的評估效率。',effects:{toxicity:4,g1:3,g2:-5,g3:-5},feedback:'總部後來回覆，這份「接班梯隊計畫」的評估標準，聽說只看數字，不看別的。'},
        {label:'隨便選一個交差了事。',hellLabel:'依現有名單順位提報，不做額外評估。',effects:{toxicity:2,g1:-2,g2:-2,g3:-2},feedback:''},
        {label:'認真評估兩人的實際能力與意願，而不是誰比較聽話。',effects:{safety:4,g1:-2,g2:3,g3:3},feedback:'你花了一個下午跟兩人分別談過，最後推薦的人選，連你自己都覺得問心無愧。',healthy:true}
      ]},
    {id:'hsu_11',npc:'achu',title:'阿柱的退休申請',scene:['阿柱提出想申請提前退休，你知道他還有兩年才符合完整年資，但他說「撐不下去了」。'],
      options:[
        {label:'「你這樣走年資會少很多，再撐一下比較划算」，用金錢考量勸退他改變心意。',hellLabel:'從年資角度分析，建議審慎評估。',effects:{g1:5,g2:-5,g3:-5,fear:6,tol:-15},feedback:'阿柱最後還是撐了下去，但你能感覺到他對這條線越來越沒有感情。'},
        {label:'沒有多問原因，直接照流程處理退休申請。',hellLabel:'依標準流程受理申請。',effects:{g2:-3,tol:-8,g1:-2,g3:-2},feedback:''},
        {label:'找阿柱聊聊「撐不下去」背後真正的原因，看看有沒有調整空間。',effects:{g3:4,tol:10,g1:2,g2:3},feedback:'原來阿柱是覺得現場沒人聽他的意見，而不是真的做不動。',healthy:true}
      ]},
    {id:'hsu_12',npc:'achu',title:'阿柱的傷病',banner:'assets/images/events/ev_injury_continue.webp',scene:['阿柱的老毛病（腰傷）又犯了，但這個月產線正缺人手，你猶豫要不要讓他繼續上線。'],
      options:[
        {label:'「先撐一下，等這波產能高峰過了再說」，讓他繼續上工。',hellLabel:'現場人力調度有限，請先配合現況。',effects:{g1:6,g2:-6,g3:-6,risk:10,tol:-18},feedback:'',
          victim:['腰傷又犯了，主管卻只叫我先撐著。我這把年紀，真的撐得住嗎？']},
        {label:'讓他請假，但心裡有點不耐煩，覺得他「老是這樣」。',hellLabel:'核准請假，內部調整排班因應。',effects:{g2:-3,toxicity:4,tol:-8,g1:-2,g3:-2},feedback:''},
        {label:'立刻安排他去看醫生，並調整他的工作內容避免負重。',effects:{g3:4,tol:10,risk:-3,g1:2,g2:3},feedback:'阿柱很意外你這麼快就做出安排。',healthy:true}
      ]},
    {id:'hsu_13',npc:'chieh',title:'小杰的建議被採用',scene:['小杰提出一個改善產線動線的建議，你發現這個想法真的可行，但你有點不想讓一個年輕人的點子搶了風頭。'],
      options:[
        {label:'採用建議，但跟廠長報告時說是「團隊集思廣益」的成果，沒提到是小杰的點子。',hellLabel:'向廠長報告為「團隊集體討論」的成果。',effects:{g1:5,g2:-5,g3:-5,tol:-18},feedback:'小杰後來從別人口中才知道，那個提案的功勞算在你頭上。'},
        {label:'採用了建議，但也沒有特別公開肯定是誰提的。',hellLabel:'採納建議並實施，未特別歸屬提案來源。',effects:{g2:-3,tol:-8,g1:-2,g3:-2},feedback:''},
        {label:'公開跟廠長說明，這是小杰的想法，讓他直接參與後續執行。',effects:{g3:4,tol:10,g2:3,g1:2},feedback:'小杰第一次覺得，自己的想法真的能改變現場的做法。',healthy:true}
      ]},
    {id:'hsu_14',npc:'chieh',title:'小杰的夜校',banner:'assets/images/events/ev_study_schedule.webp',scene:['小杰跟你請假想去上夜校進修，但剛好卡到你排的大夜班班表。'],
      options:[
        {label:'「工作要顧好，讀書是你自己的事」，拒絕調整班表。',hellLabel:'目前排班已經確定，建議另行安排進修時間。',effects:{g1:5,g2:-5,g3:-5,fear:5,tol:-15},feedback:'小杰後來還是放棄了那學期的課。'},
        {label:'勉強調整了一次班表，但語氣讓小杰覺得是欠了你一個人情。',hellLabel:'特案調整一次班表因應。',effects:{g2:-3,tol:-8,g1:-2,g3:-2},feedback:''},
        {label:'主動幫他跟其他班別協調輪班，支持他去進修。',effects:{g3:4,tol:10,g1:2,g2:3},feedback:'小杰很感謝你把他的未來放在心上。',healthy:true}
      ]},
    {id:'hsu_15',npc:'chien',title:'建宏的求助',scene:['建宏私下跟你說，他那條線的產能一直被總部盯，想跟你借幾個人手撐過這一季。'],
      options:[
        {label:'「我這邊也不夠用，你自己想辦法」，直接拒絕，語氣有點涼薄。',hellLabel:'目前本線人力也吃緊，建議自行調度。',effects:{g1:4,g2:-5,g3:-5,tol:-15},feedback:'建宏後來私下跟其他領班抱怨你「不夠意思」。'},
        {label:'答應了，但事後常拿這件事提醒建宏「欠你一次」。',hellLabel:'同意支援，並留意後續互惠安排。',effects:{g2:-3,toxicity:4,tol:-8,g1:-2,g3:-2},feedback:''},
        {label:'評估自己線上狀況後，實際調配一兩位人手支援他。',effects:{g3:4,tol:10,g2:-2,g1:2},feedback:'建宏後來在廠長面前主動提起這件事，說你夠義氣。',healthy:true}
      ]},
    {id:'hsu_16',npc:'chien',title:'建宏的競爭',scene:['廠內傳出風聲，這一季表現最好的領班有機會升任副理，建宏最近很積極在廠長面前表現。'],
      options:[
        {label:'你也開始刻意在廠長面前突顯自己線上的數字，甚至有點誇大。',hellLabel:'「更積極地」向廠長呈現本線的績效表現。',effects:{g1:6,g2:-4,toxicity:6,risk:6,tol:-12,g3:-5},feedback:'你跟建宏的關係，開始變得像在比賽，而不是同事。'},
        {label:'沒有刻意表現，但心裡對這件事越來越在意。',hellLabel:'維持平常步調，暫不特別表現。',effects:{toxicity:5,tol:-5,g2:-2,g1:-2,g3:-2},feedback:''},
        {label:'專注把自己該做的事做好，不刻意跟建宏比較。',effects:{g3:3,g1:2,safety:5,g2:3},feedback:'你發現，把心力放在真正該做的事情上，反而更踏實。',healthy:true}
      ]},
    {id:'hsu_hidden',npc:'achu',title:'阿柱的調線申請',requires:{hellCompleted:true},banner:'assets/images/events/ev_achu_transfer_request.webp',scene:['阿柱私下跟人資反映，想調到別條產線，理由寫「想學習不同製程」，但你猜得到，他只是想離你遠一點。'],
      options:[
        {label:'批准調線，順便跟接手的領班說「這個人比較難搞」。',hellLabel:'批准調線，並在交接時提醒下一位領班「這位師傅個性比較固執」。',effects:{g1:8,g2:-5,g3:-6,fear:10,toxicity:10,risk:8,tol:-20},feedback:'',
          victim:['我調到新產線的第一天，新領班就用一種奇怪的眼神看我。','後來才知道，前面的領班已經先幫我「打過招呼」了。']},
        {label:'批准調線，沒有多說什麼。',hellLabel:'尊重阿柱的職涯規劃，完成調線程序。',effects:{g1:-2,g2:-3,g3:-2,tol:-8},feedback:''},
        {label:'找阿柱聊聊，問清楚原因，並試著調整自己的帶人方式。',effects:{g1:3,g2:4,g3:5,safety:8,tol:15},feedback:'阿柱猶豫了一下，最後決定再給你、也給自己一次機會。',healthy:true}
      ]}
  ],
  climax:{title:'產線意外差點出包',npc:'chieh',flagIntro:{chien_feud:'你想起跟建宏結下的樑子，不知道會不會影響接下來的調查風向。'},scene:['一次趕工中，小杰因為疲勞操作，手差一點被機台夾到，千鈞一髮閃過。','事後，你要不要老實通報這次「未遂事故」？'],
    options:[

  testimony:{achu:{positive:'「你剛來的時候我還嗆過你，你沒有記恨，還聽我把話說完。這種領班，我這輩子沒遇過幾個。」',

    chien:{flagOverride:{chien_feud:'「他在廠長面前講我壞話那次，我就知道遲早要找回場子。工安意外的事傳開之後，我在廠內確實『順便』多提了幾句。」'},positive:'「我甩鍋給他那次，他直接拿數據跟我把話講開，沒有在廠長面前反咬我一口，我後來還滿佩服他的。」',
      hsu_03:'「我甩鍋給他之後，他也開始到處講我壞話，兩條線的人現在看到彼此都不太講話。」',
      hsu_08:'「工安紀錄配合著改，我知道那是假的，但整條線都這樣做，好像只有我自己良心不安。」',
      hsu_15:'「我開口跟他借人手，他一句『你自己想辦法』就打發我。從那之後，我在廠長面前也沒少提過他的問題。」',
      hsu_16:'「他那陣子跟我搶著在廠長面前表現，兩條線之間的氣氛，變得像是在比賽，而不是同事。」'}},

  pool:[
    {id:'staff_01',npc:'meimei',title:'金姊拉你入夥',banner:'assets/images/events/ev_clique_invitation.webp',scene:['金姊私下跟你說：「小美很難搞，大家都不跟她一組，你也別理她。」'],

        {label:'沒有主動排擠，但也不敢跟小美說話，怕被連坐。',hellLabel:'這陣子先「保持觀察」，暫時不主動找小美說話。',effects:{fear:7,toxicity:5,tol:-8,g3:4,g1:-2,g2:-2},feedback:'',voice:'大家最近都怪怪的，沒有人明說什麼，但我知道自己被排除在外了。'},

    {id:'staff_02',npc:'ahong',title:'阿宏的閒話',scene:['阿宏犯錯後，金姊在部門群組說「他真的很笨欸」，還貼了一個大笑貼圖，等著你也回應。'],

    {id:'chair_02',npc:'wang',title:'王協理的升遷案',banner:'assets/images/events/ev_promotion_complaint.webp',scene:['王協理績效全集團最好，但周處長私下提醒過你，他部門的申訴案件數也是最多的。你要不要升他？'],

    {id:'chair_03',npc:'hr',title:'難看的調查報告',scene:['周處長呈上一份全集團「心理安全感」調查，數字很難看。'],

    {id:'chair_04',npc:'victim',title:'媒體與工會的質詢',banner:'assets/images/events/ev_media_union.webp',scene:['有工會代表向媒體投書，質疑集團是否縱容職場霸凌文化。公關要你回應。'],

          victim:['公司發了新聞稿說「絕無此事」的那天，我們部門的人在群組裡苦笑，因為我們每天都在經歷「此事」。']},

    {id:'chair_05',npc:'wang',title:'申訴案的最終裁決',scene:['一起申訴案調查屬實，施暴的正是王協理，但他是你一手提拔的愛將。'],

        {label:'表面懲處（調職但不記過），實質上還是保護他。',hellLabel:'進行「職務調整」作為處理結果，同時肯定其過去貢獻。',effects:{toxicity:8,risk:6,g3:-2,g1:-2,g2:-2},feedback:'',voice:'他被調到別的部門，聽說連降都沒降。大家都心知肚明，這只是做給外面看的。'},

    {id:'chair_06',npc:'wang',title:'王協理要求擴權',scene:['王協理趁著業績亮眼，要求把旗下另一個部門也併進來由他管理。'],

    {id:'chair_07',npc:'hr',title:'周處長要離職',scene:['周處長私下遞出辭呈，理由寫「個人生涯規劃」，但你知道她是因為長期呈報的問題都沒被重視。'],

    {id:'chair_08',npc:'victim',title:'股東會的提問',banner:'assets/images/backgrounds/bg_town_hall.webp',scene:['股東會上，有小股東直接問：「公司內部的離職率是不是異常偏高？」'],
      options:[

    {id:'chair_09',npc:null,title:'接班梯隊規劃',banner:'assets/images/events/ev_succession_list.webp',scene:['人資部門提出一份「接班人計畫」，名單清一色是績效數字最亮眼的主管，包括幾位申訴案件數也偏高的人。'],

    {id:'chair_10',npc:null,icon:'🎭',title:'顧問公司的說帖',banner:'assets/images/events/ev_consultant_pitch.webp',scene:['一家管理顧問公司來提案，要價八百萬，標榜「企業文化重塑」，投影片裡全是「賦能」「同溫層破圈」這類你聽不太懂的詞。','業務代表信心滿滿地說：「保證半年內離職率下降。」'],
      options:[
        {label:'「反正報表好看就好」，直接簽約。',hellLabel:'基於「顧問專業建議」，核准這筆預算。',effects:{toxicity:6,risk:4,g2:2,g1:3,g3:-5},feedback:'半年後，離職率數字確實變好看了——因為調查方法被顧問公司悄悄換了。'},

    {id:'chair_cameo',npc:null,icon:'🔗',requires:{personaCompleted:'hsu'},title:'基層申訴案裡的名字',banner:'assets/images/events/ev_familiar_factory_clue.webp',scene:['一份新的申訴案送到你桌上，內容提到某廠一位「課長」在工安通報上做了不實記載，你瞄了一眼廠區代號，覺得有點眼熟。'],
      options:[
        {label:'「這種基層的事，不需要董事長親自過問」，直接批轉下去。',hellLabel:'依「權責分層」原則，交由該廠自行處理。',effects:{toxicity:4,risk:4,g1:2,g2:-5,g3:-5},feedback:'案子後來怎麼處理的，你沒有再追問。'},

    {id:'chair_11',npc:'wang',title:'王協理的績效造假疑慮',banner:'assets/images/backgrounds/bg_mediation_room.webp',scene:['稽核部門私下跟你反映，王協理部門的部分業績數字，疑似有灌水的嫌疑，但王協理是你最倚重的大將。'],

    {id:'chair_12',npc:'wang',title:'王協理的離職員工',scene:['王協理部門的離職率報表出爐，數字很難看，但王協理解釋是「產業競爭激烈，人才本來就會流動」。'],

    {id:'chair_13',npc:'hr',title:'周處長的續任評估',scene:['周處長的合約即將到期，有董事私下建議「換個聽話一點的人資長比較好管理」。'],

    {id:'chair_15',npc:'victim',title:'基層員工代表的陳情',banner:'assets/images/events/ev_staff_voice.webp',scene:['一位基層員工代表寫了一封長信給你，具體列出好幾個部門的管理亂象，你的秘書問要不要正式回覆。'],

    {id:'chair_16',npc:'victim',title:'集團形象與真相的拉扯',scene:['公關部門建議，與其被動應對負面新聞，不如主動發一篇「模範企業」的形象專訪，蓋過最近的負面消息。'],

  hiddenLabels:{respect:'大家真心尊重你嗎？',safety:'申訴管道你敢用嗎？',teamwork:'產線合作氣氛好嗎？',risk:'工安／仲介／遣返風險'},
  introLines:['你叫阿迪，從印尼來到舜欣實業的資源分類廠工作已經兩年，中文聽得懂七八成，但說得不算流利。','線上除了你，還有幾位同鄉，你們私下都用自己的語言溝通，這讓有些台灣同事覺得不太自在。','林班長常常懶得跟你解釋清楚事情，只丟一句「聽不懂就用比的」——但你也知道，這條線少了你們，根本轉不動。'],
  pool:[
    {id:'mig_01',npc:'lin',title:'聽不懂就用比的',banner:'assets/images/events/ev_language_barrier.webp',scene:['林班長交代新的分類標準，講得又快又用了很多術語，你聽不太懂，想再問一次。','「聽不懂就用比的，很簡單啦」，林班長顯得有點不耐煩。'],
      options:[
        {label:'不敢再問，點頭裝懂，回去憑猜測做。',hellLabel:'選擇先憑經驗判斷，不再追問細節。',effects:{fear:7,g1:-6,g2:-5,g3:-4,tol:-12},feedback:'',
          victim:['我其實完全沒聽懂，但看他不耐煩的表情，我不敢再問第二次。','那批貨後來分類分錯了，被念的人是我，但根本沒有人好好教過我。']},
        {label:'找阿仁幫忙翻譯，私下把規則搞清楚。',hellLabel:'私下請同鄉協助確認細節。',effects:{fear:8,g2:-2,g3:2,tol:-4},feedback:''},
        {label:'拿出手機翻譯App，當場請林班長再說一次重點。',effects:{g1:3,g2:3,g3:2,tol:8},feedback:'林班長愣了一下，放慢速度又講了一次，這次你聽懂了九成。',healthy:true}
      ]},
    {id:'mig_02',npc:'lin',title:'工安宣導的語言障礙',banner:'assets/images/backgrounds/bg_sorting_plant.webp',scene:['工安宣導只用中文投影片講過一次，你有些地方沒聽懂，舉手想確認，卻感覺到後面有人不耐煩地嘆氣。'],
      options:[
        {label:'把手放下，假裝聽懂了，不敢再問。',hellLabel:'選擇先行離開，事後再自行確認。',effects:{fear:8,g1:-5,g2:-4,g3:-4,risk:8,tol:-10},feedback:''},
        {label:'會後偷偷問阿仁，兩人一起猜意思。',hellLabel:'會後與同鄉互相確認內容。',effects:{fear:8,g2:-2,g3:2,risk:4,tol:-3},feedback:''},
        {label:'堅持舉手問到懂為止，即使後面的人不耐煩。',effects:{g1:3,safety:5,risk:-4,tol:8},feedback:'負責宣導的人後來多花了五分鐘，用簡單的詞彙再解釋一次。',healthy:true}
      ]},
    {id:'mig_03',npc:'lin',title:'仲介的威脅',banner:'assets/images/events/ev_agency_threat.webp',scene:['你跟林班長為了排班的事起了一點爭執，他隨口說了一句：「不然我請仲介來跟你們談。」你知道這句話背後的意思。'],
      options:[
        {label:'馬上道歉，不敢再爭取自己原本想要的排班。',hellLabel:'選擇配合原訂排班安排。',effects:{g1:-8,g2:-4,g3:-5,fear:8,tol:-15},feedback:'',
          victim:['一句「請仲介來談」，我就什麼都不敢再說了。','我知道自己的簽證跟工作綁在一起，一旦仲介介入，我可能連辯解的機會都沒有。']},
        {label:'表面上順從，但心裡開始盤算要不要換仲介公司。',hellLabel:'暫時配合，私下評估其他選擇。',effects:{fear:5,g2:-2,toxicity:4,tol:-6},feedback:''},
        {label:'冷靜地說：「排班的事我們可以討論，不需要驚動仲介。」',effects:{g1:3,safety:4,risk:-3,tol:6},feedback:'林班長沒想到你會這樣回應，那句話後來也沒再提起。',healthy:true}
      ]},
    {id:'mig_04',npc:'lin',title:'看不懂的加班費',banner:'assets/images/events/ev_payslip_confusion.webp',scene:['這個月的薪資單，加班費的計算方式跟你自己算的對不起來，你想問清楚，但表單全部都是中文。'],
      options:[
        {label:'覺得問了也是白問，就這樣算了。',hellLabel:'選擇先不追究，之後再觀察。',effects:{fear:6,g1:-6,g2:-3,g3:-4,tol:-10},feedback:''},
        {label:'私下跟同鄉抱怨，但沒有真的去問清楚。',hellLabel:'與同鄉私下討論此事。',effects:{fear:5,toxicity:4,tol:-5,g2:-2},feedback:''},
        {label:'請阿仁陪你一起去，拿著計算機當面把數字對清楚。',effects:{g1:3,g2:2,safety:4,tol:8},feedback:'對完之後發現真的算錯了，工廠後來補了差額給你。',healthy:true}
      ]},
    {id:'mig_05',npc:'kai',title:'聽不懂的閒話',scene:['小凱跟另一位台灣同事有說有笑，你經過的時候，他們突然壓低音量，你聽不懂內容，但直覺覺得是在說你們。'],
      options:[
        {label:'假裝沒注意到，但心裡開始越來越不舒服。',hellLabel:'不予理會，繼續手邊工作。',effects:{fear:7,toxicity:5,g1:-4,g3:-4,tol:-8},feedback:''},
        {label:'跟阿仁講這件事，兩人一起猜測、越講越氣。',hellLabel:'與同鄉討論此事，交換看法。',effects:{fear:8,toxicity:4,g3:2,tol:-4},feedback:''},
        {label:'直接微笑走過去問：「在聊什麼？我也想聽。」',effects:{g1:4,g3:3,safety:4,tol:8},feedback:'小凱有點尷尬，說只是在聊昨天的球賽，氣氛意外地緩和下來。',healthy:true}
      ]},
    {id:'mig_06',npc:'ren',title:'同鄉的壓力',scene:['你這陣子身體不太舒服想請假，阿仁卻勸你：「別讓台灣人覺得我們愛請假，忍一下就好。」'],
      options:[
        {label:'聽阿仁的話，硬撐著繼續上工。',hellLabel:'選擇繼續配合排班，暫不請假。',effects:{fear:5,g1:3,g2:-2,g3:3,tol:-8},feedback:'',
          victim:['身體真的很不舒服，但連自己人都要我忍，我開始不知道能跟誰說真話。']},
        {label:'請了假，但心裡對阿仁那句話有點在意。',hellLabel:'依身體狀況請假處理。',effects:{fear:8,g1:-1,g2:-2,g3:1,tol:-3},feedback:''},
        {label:'「身體是自己的，該休息就要休息」，堅持請假就醫。',effects:{g1:-3,g2:-1,g3:2,safety:5,tol:6},feedback:'阿仁後來也沒再說什麼，其實他自己上次也硬撐了很久，但你能感覺到，有人私下說你「愛請假」。',healthy:true}
      ]},
    {id:'mig_07',npc:'ren',title:'聽不懂的報復',scene:['阿仁提議，反正林班長聽不懂你們的語言，大家可以用自己的話公開取笑他，「他也聽不出來，很安全」。'],
      options:[
        {label:'跟著一起笑，覺得這是難得可以出氣的機會。',hellLabel:'順勢加入輕鬆的閒聊氣氛。',effects:{fear:9,g1:6,g2:-5,g3:5,toxicity:5,tol:-12},feedback:'產線上開始流傳一種「他們自己人才懂的笑話」，林班長隱約感覺到，卻抓不到把柄。'},
        {label:'沒有加入，但也沒有阻止大家繼續講。',hellLabel:'不參與話題，維持中立。',effects:{fear:8,toxicity:3,tol:-4,g2:-2},feedback:''},
        {label:'「這樣不太好吧，他聽不懂不代表可以這樣說他」，勸大家別鬧了。',effects:{g3:4,safety:4,g1:-2,tol:6},feedback:'阿仁聳聳肩，話題結束了，但你能感覺到有點掃興的氣氛。',healthy:true}
      ]},
    {id:'mig_08',npc:'kai',title:'不教訣竅的新人',banner:'assets/images/events/ev_withholding_knowhow.webp',scene:['小凱剛調來這條線，手忙腳亂，你們同鄉私下都知道幾個省力的訣竅，但沒有人主動教他。'],
      options:[
        {label:'跟著大家一起，故意不教他，看他手忙腳亂覺得有點好笑。',hellLabel:'依標準流程讓他自行摸索。',effects:{fear:9,g1:5,g2:-5,g3:5,tol:-15},feedback:'',
          victim:['大家好像都知道一些訣竅，卻沒有人願意教我，我開始覺得自己是不是很討人厭。']},
        {label:'沒有主動教，但如果他問了才簡單回答。',hellLabel:'被動提供必要協助。',effects:{fear:8,g2:-2,tol:-6},feedback:''},
        {label:'主動花時間教他幾個訣竅，讓他快點上手。',effects:{g1:3,g3:4,g2:2,tol:8},feedback:'小凱很感謝你，後來也開始會主動找你聊天。',healthy:true}
      ]},
    {id:'mig_09',npc:'ren',title:'集體不配合',scene:['林班長宣布一項新的分類規定，阿仁私下說服大家：「我們就裝作聽不懂，看他怎麼辦」，想給林班長一個下馬威。'],
      options:[
        {label:'跟著一起裝傻，讓新規定推不下去。',hellLabel:'配合大家的默契，暫緩配合新規定。',effects:{fear:10,g1:6,g2:-6,g3:6,risk:6,tol:-14},feedback:'林班長在稽核面前很難堪，新規定拖了快兩週才勉強上路。'},
        {label:'表面應付，私下還是照自己的方式做。',hellLabel:'私下維持原有作業方式。',effects:{fear:8,g2:-3,tol:-6},feedback:''},
        {label:'私下跟林班長說清楚，大家其實是不太懂新規定，不是故意刁難。',effects:{g3:4,safety:5,g1:2,tol:8},feedback:'林班長後來重新用簡單的圖示說明了一次，配合度明顯提升。',healthy:true}
      ]},
    {id:'mig_10',npc:'kai',title:'最累的活都給他',scene:['分派工作的時候，你發現同鄉們有默契地把最髒最重的活都留給小凱，「反正他是台灣人，比較不會被欺負太過分」。'],
      options:[
        {label:'跟著這樣分配，反正不是自己做。',hellLabel:'依現場默契進行分工。',effects:{fear:9,g1:5,g2:-4,g3:5,tol:-15},feedback:'',
          victim:['每次最髒最重的活都是我在做，我不知道自己是不是特別倒楣。']},
        {label:'沒有主動安排，但也沒有出面調整。',hellLabel:'不介入分工安排。',effects:{fear:8,g2:-2,tol:-6},feedback:''},
        {label:'提議大家輪流分擔最辛苦的工作，不要都推給同一個人。',effects:{g1:3,g3:4,g2:2,tol:8},feedback:'小凱很意外，這是他到職以來第一次不用整天做最累的活。',healthy:true}
      ]},
    {id:'mig_11',npc:'lin',title:'裝傻拖延',scene:['林班長交代一件你不太想做的任務，你發現只要裝作聽不懂，他通常懶得再解釋，事情就會不了了之。'],
      options:[
        {label:'故意裝傻，一直拖到林班長放棄，改叫別人做。',hellLabel:'表示需要更多時間理解，暫緩處理。',effects:{fear:9,g1:5,g2:-5,g3:-5,toxicity:4,tol:-12},feedback:'林班長後來真的把工作轉給別人了，但你注意到他開始對你有些防備。'},
        {label:'拖了一陣子才勉強做，但態度很敷衍。',hellLabel:'延後處理，事後補做。',effects:{fear:8,g2:-3,tol:-6},feedback:''},
        {label:'如實說明自己不理解的部分，請他換個方式說明。',effects:{g1:2,g3:3,safety:4,tol:6},feedback:'林班長這次放慢速度解釋，你也把任務確實完成了。',healthy:true}
      ]},
    {id:'mig_12',npc:'ren',title:'排擠不同鄉的同事',banner:'assets/images/events/ev_nationality_exclusion.webp',scene:['產線新來一位越南籍的同事，阿仁私下說：「我們印尼這掛的，不用跟她走太近」。'],
      options:[
        {label:'跟著疏遠她，午休也不找她一起。',hellLabel:'維持原本的用餐與交流安排。',effects:{fear:10,g1:5,g2:-4,g3:5,toxicity:4,tol:-14},feedback:'',
          victim:['我在這裡一個認識的人都沒有，同樣是外籍移工，卻感覺被排除在外。']},
        {label:'沒有主動疏遠，但也沒有特別接近她。',hellLabel:'保持一般同事互動。',effects:{fear:8,g2:-2,tol:-5},feedback:''},
        {label:'「大家都是離鄉背井工作，不用分那麼細」，主動邀她一起吃飯。',effects:{g1:3,g3:4,safety:4,tol:8},feedback:'她後來說，這是她來台灣後，第一次覺得不孤單。',healthy:true}
      ]},
    {id:'mig_13',npc:'ren',title:'謊報林班長',scene:['阿仁提議，大家可以一起跟仲介謊報林班長對你們不當對待，「這樣說不定能換到更好的雇主」。'],
      options:[
        {label:'加入，一起添油加醋地誇大林班長的行為。',hellLabel:'配合同鄉的說法一併反映。',effects:{fear:16,g1:6,g2:-6,g3:6,toxicity:8,risk:12,tol:-15},feedback:'',
          victim:['（林班長心裡）我確實對他們不夠好，但被指控做過根本沒做過的事，我真的百口莫辯。']},
        {label:'沒有加入誇大，但也沒有阻止大家這麼做。',hellLabel:'不參與此事，保持觀望。',effects:{fear:7,toxicity:5,risk:6,tol:-6,g1:-2,g2:-3,g3:-2},feedback:''},
        {label:'「他是有不對的地方，但我們說實話就好，不要編造」，勸大家實事求是。',effects:{g3:4,safety:5,risk:-4,tol:8},feedback:'仲介後來確實處理了排班不合理的問題，林班長也因此被要求改善溝通方式。',healthy:true}
      ]},
    {id:'mig_14',npc:'kai',title:'嘲笑小凱的失誤',scene:['小凱因為不熟悉流程出了一個包，同鄉們私下用你們的語言笑他「台勞還不如我們」。'],
      options:[
        {label:'跟著笑，覺得難得可以嘲笑台灣人一次。',hellLabel:'跟著大家一起輕鬆帶過。',effects:{fear:10,g1:5,g2:-4,g3:5,toxicity:5,tol:-14},feedback:'',
          victim:['我聽不懂他們在笑什麼，但看那個表情，我知道一定是在笑我。']},
        {label:'沒有笑，但也沒有制止大家繼續講。',hellLabel:'不參與，維持沉默。',effects:{fear:5,toxicity:4,tol:-6,g1:-2,g2:-2,g3:-2},feedback:''},
        {label:'「換作是我們剛來的時候也一樣，別這樣說他」，出言緩頰。',effects:{g1:2,g3:4,g2:2,tol:8},feedback:'小凱後來知道是你幫忙緩頰，對你多了一份信任。',healthy:true}
      ]},
    {id:'mig_15',npc:'ren',title:'同鄉頭的架子',scene:['你在同鄉之間資歷最深、中文也最好，漸漸變成大家有事都會先問你的「頭」，你發現只要開口，新來的同鄉都會順著你。'],
      options:[
        {label:'開始要求新來的同鄉幫你跑腿、分擔你的工作份額，作為「照顧」他們的交換。',hellLabel:'請新進同鄉協助分擔部分工作，作為適應期安排。',effects:{fear:11,g1:7,g2:-5,g3:-6,toxicity:6,tol:-15},feedback:'新來的同鄉表面上都很尊敬你，但沒有人真的想找你聊心事。'},
        {label:'享受大家對你的尊敬，但沒有真的要求什麼。',hellLabel:'維持現有的資深地位與人際關係。',effects:{fear:8,g2:-2,toxicity:3,tol:-4},feedback:''},
        {label:'把這份信任用在真正照顧新人適應上，不求回報。',effects:{g1:4,g3:5,g2:2,tol:10},feedback:'你成為新來同鄉真心信任、願意商量事情的對象，而不是害怕的對象。',healthy:true}
      ]},
    {id:'mig_16',npc:'kai',title:'被排除的交班群組',banner:'assets/images/events/ev_handover_group_excluded.webp',scene:['你們同鄉私下建了一個LINE群組，方便用自己的語言快速溝通交班注意事項，但小凱因為聽不懂，一直被排除在外，導致他漏看了幾次重要的交班提醒。'],
      options:[
        {label:'「反正他是台灣人，重要的事班長會直接跟他說」，繼續把他排除在群組外。',hellLabel:'維持原有溝通方式，不特別調整群組成員。',effects:{fear:10,g1:6,g2:-6,g3:6,tol:-16},feedback:'',
          victim:['交班的重要提醒都在那個我看不懂的群組裡討論，我常常是最後一個知道要注意什麼的人。','有一次因為漏看提醒，還被記了一次缺失，但根本沒有人告訴過我。']},
        {label:'私下跟小凱說重點，但懶得每次都翻譯給他聽。',hellLabel:'視情況口頭補充重點。',effects:{fear:5,g2:-3,tol:-8,g1:-2},feedback:''},
        {label:'主動建一個中文交班群組，或請人代為翻譯重要訊息給小凱。',effects:{g1:3,g3:4,g2:2,tol:8},feedback:'小凱說，這是他到職以來第一次覺得，交班資訊終於跟大家同步了。',healthy:true}
      ]},
    {id:'mig_17',npc:'kai',title:'被動手腳的工具',banner:'assets/images/events/ev_tool_tampering.webp',scene:['小凱最近老是找不到自己的工具，或發現工具被動過手腳。你其實知道，是同鄉裡幾個人在整他，覺得「台灣新人不好惹一下不知道厲害」。'],
      options:[
        {label:'明知道是誰做的，但沒有阻止，甚至覺得有點好笑。',hellLabel:'對此事不予干涉。',effects:{fear:13,g1:6,g2:-6,g3:6,toxicity:5,tol:-18},feedback:'',
          victim:['我的工具三不五時就不見或被動過，我開始懷疑是不是自己太不小心，還是有人故意的。']},
        {label:'知道是誰做的，私下勸了一句，但沒有真的制止。',hellLabel:'私下提醒，未進一步處理。',effects:{fear:6,toxicity:4,tol:-8,g2:-2},feedback:''},
        {label:'直接跟大家說清楚，這樣做太過分，要求立刻歸還並道歉。',effects:{g1:3,g3:4,safety:4,tol:8},feedback:'工具後來物歸原位，雖然沒有人承認，但這種事之後沒再發生過。',healthy:true}
      ]},
    {id:'mig_18',npc:'kai',title:'聽不懂的羞辱',banner:'assets/images/events/ev_language_insult.webp',scene:['小凱做事的方式讓同鄉們私下用家鄉話嘲笑他「笨手笨腳」，甚至當著他的面講，雖然他聽不懂內容，但看得出那種輕蔑的語氣和眼神。'],

          voice:'（小凱心裡）我聽不懂他們在說什麼，但那種眼神跟笑聲，我知道不是什麼好話。我開始越來越不想上班。'},
        {label:'沒有加入，但聽到了也沒有制止，假裝沒注意到。',hellLabel:'不參與，維持中立。',effects:{fear:6,toxicity:4,tol:-8,g2:-2},feedback:''},
        {label:'「他聽不懂又不代表可以這樣說他」，當面請大家用中文，或別再這樣說。',effects:{g1:3,g3:5,safety:5,tol:10},feedback:'氣氛尷尬了一下，但之後大家講話真的比較收斂了。',healthy:true}

    {id:'mig_hidden',npc:'kai',title:'小凱真的要走了',requires:{hellCompleted:true},banner:'assets/images/events/ev_kai_last_days.webp',scene:['小凱正式跟廠方提出離職申請，你們同鄉私下在討論，要不要在他最後這幾天，再「教訓」他一次。'],
      options:[
        {label:'跟著提議，趁小凱還沒走，最後再讓他難堪一次。',hellLabel:'趁著交接期間，讓大家更確實地驗收工作，確保交接沒有疏漏。',effects:{fear:16,g1:6,g2:-4,g3:6,toxicity:8,risk:6,tol:-18},feedback:'',
          victim:['我最後幾天的班表，被排得特別難做，工具也一樣常常不見。我只想快點離開這裡。']},
        {label:'沒有加入，但也沒有阻止大家的計畫。',hellLabel:'不參與交接安排的討論，保持觀望。',effects:{fear:5,g1:-2,g2:-2,g3:-2,tol:-8},feedback:''},
        {label:'在小凱走之前，主動跟他道歉，並勸大家別再為難他。',effects:{g1:3,g2:2,g3:4,safety:5,tol:10},feedback:'小凱很意外，離開前跟你說了聲謝謝。',healthy:true}
      ]}
  ],
  climax:{title:'集體施壓事件',npc:'kai',banner:'assets/images/events/ev_group_pressure_kai.webp',flagIntro:{migrant_framed_lin:'你想起自己曾經聯合大家想搞垮林班長，現在看著小凱的處境，心裡有點五味雜陳。'},scene:['同鄉們決定「教訓」小凱一頓——藏起他常用的工具、集體已讀不回他的求助訊息，你注意到小凱這幾天看起來很沮喪，開始說要離職。','林班長夾在中間，似乎也不知道該怎麼處理這條線上的氣氛。'],
    options:[
      {label:'加入集體排擠，反正大家都這樣做。',hellLabel:'維持現有的產線互動默契。',effects:{fear:17,g1:8,g2:-6,g3:6,toxicity:6,risk:8,tol:-20},feedback:'',
        victim:['我的工具不見了好幾次，訊息也沒有人回。我開始覺得，是不是我真的不屬於這裡。']},
      {label:'沒有主動參與，但也沒有阻止大家繼續排擠他。',hellLabel:'不介入此事，維持觀望。',effects:{fear:7,toxicity:5,tol:-8,g2:-2},feedback:''},
      {label:'把工具還給小凱，並勸大家不要再這樣對他。',effects:{g3:5,safety:6,g1:-3,tol:10},feedback:'小凱後來打消了離職的念頭，你們的關係也漸漸緩和下來。',healthy:true}
    ]},
  midReveal:{lines:['這陣子產線很安靜，大家都乖乖照你們同鄉這掛的默契做事，連林班長都不太敢多說什麼。'],
    leftLabel:'表面配合度',leftFromGauge:'g1',leftClass:'good',rightLabel:'正式申訴／通報件數',rightCompute:S=>Math.max(0,Math.round(S.risk/15))+'件',rightClass:'bad',
    after:'你不知道的是，工廠的意見箱裡，最近多了好幾張沒有具名的紙條。'},
  dilemma:{title:'廠方的問話',npc:'lin',banner:'assets/images/events/ev_factory_interrogation.webp',scene:['工廠接到匿名反映，開始逐一約談產線人員，輪到你了。','約談的人問：「這陣子產線上發生的事，你可以老實說說看嗎？」你知道，這牽涉到林班長對你們的不當要求，也牽涉到你們同鄉小圈圈對小凱做過的事。'],
    options:[
      {label:'全部否認，說大家相處一直都很融洽。',hellLabel:'表示產線氣氛良好，未觀察到特殊狀況。',effects:{fear:11,risk:18,tol:-10,g1:4,g2:-5,g3:-5},feedback:'約談的人看著你，眼神顯示他們並不完全相信。'},
      {label:'只挑對自己有利的部分說，避重就輕。',hellLabel:'部分說明，強調自身立場。',effects:{fear:8,risk:9,toxicity:5,tol:-5,g1:-2,g2:-3,g3:-2},feedback:''},
      {label:'誠實說出完整經過，包括自己不對的地方。',effects:{risk:-8,safety:6,tol:10,g1:2,g2:3,g3:3},feedback:'你也第一次說出了語言不通帶來的委屈，約談的人聽完後，沉默了很久。',healthy:true}
    ]},
  testimony:{
    lin:{positive:'「後來我才知道，語言不通造成的誤會有多深。謝謝你願意當面跟我把話說開，而不是用別的方式讓我難堪。」',
      mig_01:'「我當時真的不耐煩，直到後來聽說有人因為聽不懂被檢討，我才意識到自己有多懶得解釋。」',
      mig_11:'「他後來被發現常常裝作聽不懂拖延工作，我才明白，不是他真的聽不懂，是他學會了用這招對付我。」',
      mig_13:'「我確實對他們不夠好，但被指控做過根本沒做過的事，我真的百口莫辯，那段時間我天天睡不好。」'},
    ren:{positive:'「我們同鄉之間本來就要互相照顧，但你後來讓我知道，照顧不代表可以拿來欺負別人。」',
      mig_07:'「我提議大家用自己的話取笑林班長，他後來隱約感覺到，卻抓不到把柄，其實我們都心知肚明。」',
      mig_09:'「那次我們集體裝傻不配合新規定，林班長在稽核面前很難堪，那件事我後來想起來，其實有點過分。」',
      mig_15:'「他變成我們這掛的『頭』之後，開始要求新來的人幫他跑腿，表面尊敬，其實沒有人真的想靠近他。」'},
    kai:{positive:'「謝謝你教我那些訣竅，也謝謝你後來幫我把工具找回來。我一直記得，是你讓我沒有真的離職。」',
      mig_08:'「大家好像都知道一些訣竅，卻沒有人願意教我，我開始覺得自己是不是很討人厭。」',
      mig_10:'「每次最髒最重的活都是我在做，我不知道自己是不是特別倒楣，直到後來才知道是被刻意安排的。」',
      climax:'「我的工具不見了好幾次，訊息也沒有人回。我開始覺得，是不是我真的不屬於這裡。」',
      mig_16:'「交班的重要提醒都在那個我看不懂的群組裡討論，我常常是最後一個知道要注意什麼的人，有一次還因此被記了缺失。」',
      mig_17:'「我的工具三不五時就不見或被動過，我開始懷疑是不是自己太不小心，還是有人故意的。」',
      mig_18:'「我聽不懂他們在說什麼，但那種眼神跟笑聲，我知道不是什麼好話。我開始越來越不想上班。」'}
  },
  endings:[
    {id:'A',name:'廠內小霸王',text:'你在同鄉裡呼風喚雨，連台灣同事都不太敢惹你，但你聽不到真話已經很久了。你以為自己贏得了地位，其實只換來表面的沉默。'},
    {id:'B',name:'被遣返的孤島',text:'調查證實了你參與過的那些事，仲介決定提前終止契約，你被安排遣送回國，帶著複雜的心情，離開這片工作了好幾年的土地。'},
    {id:'C',name:'誰都不信的日子',text:'你開始懷疑身邊的每一個人，連最親近的同鄉也不例外。你贏得了畏懼，卻連一個真心朋友都沒能留下。'},
    {id:'D',name:'產線的地下老大',text:'你在產線裡建立了自己的勢力範圍，效率還算過得去，但沒有人真心信任你，大家只是不敢惹你。'},
    {id:'E',name:'遲來的公道',text:'在最後的問話裡，你終於誠實面對自己做過與被做過的事。事情沒有立刻變好，但你開始為自己、也為小凱討回一點公道。'},
    {id:'F',name:'帶得走的尊嚴',text:'你選擇了尊重取代恐懼，即使語言不通，你也在這條產線上，真正贏得了大家的信任，不分國籍。'},
    {id:'G',name:'打破循環的人',hidden:true,text:'你不但沒有複製自己曾經受過的不公平對待，還讓小凱、林班長、甚至仲介都看見了——尊重，從來不分國籍。'}
  ],
  personalityMap:{lin:{name:'恃強欺弱型',desc:'你利用語言的落差，讓林班長也嚐到被誤解、不被尊重的滋味。'},ren:{name:'拉幫結派型',desc:'你跟著同鄉小圈圈一起排擠、算計別人，換取歸屬感。'},kai:{name:'恃強凌弱型',desc:'你把在其他地方受的委屈，轉嫁到更弱勢的小凱身上。'},
    growthHigh:{name:'跨文化橋樑型',desc:'你證明了語言從來不是障礙，尊重才是。'},growthLow:{name:'覺醒型',desc:'你曾經以牙還牙，但你開始選擇不一樣的路。'}},
  rationalize:{

    kai:['他是台灣人，吃點虧沒關係吧','我們才是真正辛苦做事的人'],
    generic:['在這裡本來就要靠自己人','忍一忍，合約到期就結束了']

/* ---------------- 人資／申訴受理：曾組長（人力資源部，制度執行者的兩難） ---------------- */
hrstaff:{ id:'hrstaff', level:'人資／申訴受理', name:'曾組長', dept:'人力資源部',
  blurb:'負責受理全公司申訴案件的人資組長，手握別人不知道的秘密——誰檢舉了誰、誰的案子被壓下來、誰的考核被動了手腳。這份工作讓你很有權力，也讓你開始習慣，把別人的痛苦當成自己的籌碼。',
  gauges:[{key:'g1',label:'話語權',en:'CONTROL',start:35},{key:'g2',label:'結案效率',en:'CLOSURE RATE',start:50},{key:'g3',label:'員工信任度',en:'STAFF TRUST',start:40}],
  npcs:[{key:'petitioner',name:'小葳',role:'申訴員工',icon:'🥺'},{key:'accused',name:'夏經理',role:'遭申訴主管',icon:'💼'},{key:'colleague',name:'阿政',role:'人資新人',icon:'🌱'}],
  orgIcon:'📁',
  hiddenLabels:{respect:'同仁真的信任人資嗎？',safety:'申訴管道有被認真使用嗎？',teamwork:'部門間合作氣氛好嗎？',risk:'制度失靈曝光的風險'},
  introLines:['你是人力資源部的曾組長，負責受理全公司的申訴案件，同時也管理底下幾位人資同仁。','你手上握有別人不知道的秘密——誰檢舉了誰、誰的案子被壓下來、誰的考核被動了手腳。','這份工作讓你變得很有權力，卻也讓你開始習慣，把別人的痛苦，當成自己談判的籌碼。'],
  pool:[
    {id:'hr_01',npc:'petitioner',title:'第一次申訴的小葳',banner:'assets/images/events/ev_attentive_listening.webp',scene:['小葳鼓起勇氣走進你的辦公室，說想反映主管對她言語羞辱的事，聲音有點發抖。'],
      options:[
        {label:'「這種事很主觀耶，你確定不是自己太敏感？」，語帶質疑地打斷她。',hellLabel:'表示需要更具體的事證才能受理。',effects:{fear:11,g1:6,g2:3,g3:-6,tol:-18},feedback:'',
          victim:['我鼓起很大的勇氣才走進那間辦公室，結果第一句話就被質疑是不是我太敏感。','我後來再也沒有勇氣走進那間辦公室了。']},
        {label:'面無表情地做筆記，程序性地問完就結束，沒有給任何情緒上的回應。',hellLabel:'依標準流程完成初步紀錄。',effects:{fear:5,g2:2,tol:-8,g3:-3},feedback:''},
        {label:'放下手邊的事，認真傾聽，並肯定她願意說出來的勇氣。',effects:{g3:4,safety:5,g1:-2,tol:8},feedback:'小葳說，這是她這陣子第一次覺得，自己的感受是被認真對待的。',healthy:true}
      ]},
    {id:'hr_02',npc:'petitioner',title:'申訴案的冷處理',scene:['小葳的案子受理滿一個月了，她私下來問進度，你其實根本還沒開始查。'],
      options:[
        {label:'「案子很多，你的還在排隊，急也沒有用」，語氣有點不耐煩。',hellLabel:'表示案件量大，需要依序處理。',effects:{fear:10,g1:5,g2:4,g3:-6,tol:-16},feedback:'',
          victim:['我只是想知道案子進度到哪了，得到的答案卻是「排隊，急也沒用」。','那之後我再也不敢主動去問，只能自己每天胡思亂想。']},
        {label:'隨口說「快了快了」，但其實完全沒有動作。',hellLabel:'表示會盡快安排進度。',effects:{fear:5,g2:2,tol:-8,g3:-3},feedback:''},
        {label:'誠實告知目前進度確實落後，並承諾具體的處理時間。',effects:{g3:4,safety:4,g2:-2,tol:8},feedback:'小葳雖然失望，但至少知道自己沒有被遺忘。',healthy:true}
      ]},
    {id:'hr_03',npc:'petitioner',title:'案子的證據不足',banner:'assets/images/events/ev_insufficient_evidence.webp',scene:['小葳的申訴案調查後，證據確實比較薄弱，很難認定，你要怎麼跟她說明結果。'],
      options:[
        {label:'「就說了證據不足，這種事本來就很難查，你不要太計較」，語帶敷衍與嘲諷。',hellLabel:'依調查結果告知證據不足，建議理性看待。',effects:{fear:13,g1:5,g2:3,g3:-6,tol:-18,risk:6},feedback:'',
          victim:['我知道證據不足，但那種說話的語氣，好像在笑我小題大作。','讓我覺得，比起被欺負，被這樣說更難堪。']},
        {label:'用制式的公文用語回覆「查無實據」，沒有多做說明。',hellLabel:'以正式公文回覆調查結果。',effects:{fear:5,g2:2,tol:-8,g3:-3},feedback:''},
        {label:'耐心說明調查過程與限制，並告訴她未來如果再發生，隨時可以再反映。',effects:{g3:4,safety:5,g1:-2,tol:8},feedback:'小葳雖然難過，但至少感受到你有認真查過，而不是隨便打發。',healthy:true}
      ]},
    {id:'hr_04',npc:'petitioner',title:'報復性的調職',banner:'assets/images/events/ev_retaliation_transfer.webp',scene:['小葳申訴後不久，她的主管以「業務調整」為由把她調到更差的職位，她來問你這算不算報復。'],
      options:[
        {label:'「調職是主管的人事權限，我們不好介入」，選擇不追究。',hellLabel:'表示人事調動屬於單位主管權限。',effects:{fear:14,g1:6,g2:4,g3:-7,tol:-20,risk:8},feedback:'',
          victim:['申訴之後換來的是更差的職位，人資卻說這是主管的權限，不方便介入。','我開始懂了，原來申訴的代價，可能比忍下來更痛。']},
        {label:'私下跟主管提醒一下，但沒有正式介入調查是否為報復性調職。',hellLabel:'私下提醒相關主管留意觀感。',effects:{fear:5,g2:2,tol:-8,g3:-3},feedback:''},
        {label:'正式啟動「不當對待申訴人」的調查程序，暫緩這次調職。',effects:{g3:5,safety:6,risk:-4,tol:10},feedback:'調職暫緩了，小葳說，這是她第一次覺得，制度真的站在她這邊。',healthy:true}
      ]},
    {id:'hr_05',npc:'petitioner',title:'情緒勒索式的關心',scene:['另一位同仁想申訴，你聽完後說：「你確定要這樣做嗎？以後在公司大家都會知道，你要想清楚。」'],
      options:[
        {label:'持續用這種方式暗示她「不要沒事找事」，讓她自己打退堂鼓。',hellLabel:'提醒她審慎評估後續影響。',effects:{fear:13,g1:6,g2:3,g3:-7,tol:-18,risk:6},feedback:'',
          victim:['我鼓起勇氣想反映，換來的卻是一句「你確定嗎？大家都會知道」。','後來我沒有再提這件事，只是不知道還要忍多久。']},
        {label:'說完那句話後就沒再多說，但話已經造成了效果。',hellLabel:'依程序告知後續可能情形。',effects:{fear:5,g2:2,tol:-8,g3:-3},feedback:''},
        {label:'「不管你決定怎麼做，我都會保密處理，你不用有壓力」，收回那句話並道歉。',effects:{g3:4,safety:5,tol:8},feedback:'她後來還是決定申訴，你也確實做到了保密處理。',healthy:true}
      ]},
    {id:'hr_06',npc:'petitioner',title:'匿名申訴的追查',banner:'assets/images/events/ev_anonymous_tension.webp',scene:['一份匿名申訴信送到你桌上，內容明顯是在講某位主管，你其實透過用詞跟細節，大概能猜出是誰寫的。'],

function forceWrapText(s){
  let depth = 0;
  let out = '';
  for(const ch of s){
    if(ch==='「') depth++;

    if(ch==='，' && depth===0){ out += ch + '<br>'; continue; }

  }

}

function applyEffects(effects, npcKey){
  const dice = 0.8 + Math.random()*0.5;
  const visibleDeltas = {};
  Object.keys(effects).forEach(k=>{
    let v = effects[k];
    if(k==='g1'||k==='g2'||k==='g3'){
      const before = S[k];
      S[k] = clamp(S[k] + v, 0, 100);
      const applied = S[k]-before;
      if(applied!==0) visibleDeltas[k] = (visibleDeltas[k]||0)+applied;
    }
    else if(k==='tol'){ if(npcKey){ const varied=Math.round(v*dice); S.tol[npcKey]=clamp(S.tol[npcKey]+varied,0,100);} }
    else { const slope = (S.modifier && S.modifier.id==='slippery_slope') ? 1.3 : 1; const varied = Math.round(v*dice*(S.hell?1.2:1)*slope); S[k] = clamp(S[k] + varied, 0, 200); }
  });
  return visibleDeltas;
}
function deltaChipsHtml(persona, visibleDeltas){
  const keys = Object.keys(visibleDeltas);
  if(!keys.length) return '';
  const chips = keys.map(k=>{
    const g = persona.gauges.find(gg=>gg.key===k);
    const d = visibleDeltas[k];
    const sign = d>0?'up':'down';
    const arrow = d>0?'▲':'▼';
    return `<span class="delta-chip ${sign}">${arrow} ${g.label} ${d>0?'+':''}${d}</span>`;
  }).join('');
  return `<div class="delta-row">${chips}</div>`;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function buildSequence(n, quizCount){
  // 心裡話檢查不再每個情境都跳，而是隨機挑幾個情境後面出現——但「這一輪總共會跳幾次」是固定的，
  // 只有「跳在哪裡」是隨機的，每次只聚焦「剛發生的那一件事」，不是累積好幾件事再一次總結
  const count = Math.min(quizCount!==undefined?quizCount:2, n);
  const positions = new Set(shuffle([...Array(n).keys()]).slice(0, count));
  let seq=['intro'];
  let qn = 0;
  for(let i=0;i<n;i++){
    seq.push('draw'+i);
    if(positions.has(i)){ qn++; seq.push('quiz'+qn); }
  }
  seq.push('climax','midReveal','dilemma','judgment','ending');
  return seq;
}

  });

function updateGauges(visibleDeltas, blind){
  S.persona.gauges.forEach(g=>{
    if(!blind){
      document.getElementById('gv-'+g.key).textContent = Math.round(S[g.key]);
      document.getElementById('gf-'+g.key).style.width = clamp(S[g.key],0,100)+'%';
    }
    const d = (visibleDeltas && !blind) ? visibleDeltas[g.key] : undefined;
    if(d){
      const gaugeEl = document.getElementById('gauge-'+g.key);
      const badge = document.getElementById('gd-'+g.key);
      if(gaugeEl && badge){
        badge.textContent = (d>0?'+':'')+d;
        badge.className = 'g-delta show '+(d>0?'up':'down');
        gaugeEl.classList.add('pulse');
        clearTimeout(gaugeEl._pulseTimer);
        gaugeEl._pulseTimer = setTimeout(()=>{ gaugeEl.classList.remove('pulse'); badge.className='g-delta'; }, 1400);
      }
    }
  });
}

function devSaveEvent(pid, sourceId){
  const ev = devFindEvent(pid, sourceId);
  const evOverrides = {};
  ev.options.forEach((opt,i)=>{
    const optOv = {};
    DEV_EFFECT_KEYS.forEach(k=>{
      const el = document.getElementById(`dev-${i}-${k}`);
      const val = Math.round(Number(el.value)||0);
      const base = opt.effects[k]!==undefined ? opt.effects[k] : 0;
      if(val !== base) optOv[k] = val;
    });
    if(Object.keys(optOv).length) evOverrides[i] = optOv;
  });
  if(!OVERRIDES[pid]) OVERRIDES[pid] = {};
  if(Object.keys(evOverrides).length){ OVERRIDES[pid][sourceId] = evOverrides; }
  else { delete OVERRIDES[pid][sourceId]; if(!Object.keys(OVERRIDES[pid]).length) delete OVERRIDES[pid]; }
  saveOverrides();
  devEventScreen(pid, sourceId);
}

const LENGTH_OPTIONS = {short:4, long:8};
const QUIZ_COUNT = {short:2, long:3};

function eventAvailable(ev, persona){
  if(!ev.requires) return true;
  if(ev.requires.personaCompleted){
    const m = META[ev.requires.personaCompleted];
    if(!(m && m.runsCompleted>=1)) return false;
  }
  if(ev.requires.hellCompleted){
    const m = personaMeta(persona.id);
    if(!(m.runsHell>=1)) return false;
  }
  return true;
}
function availablePool(persona){ return persona.pool.filter(ev=>eventAvailable(ev, persona)); }
function drawPool(persona, count){
  const byNpc = {};
  availablePool(persona).forEach(ev=>{ const k = ev.npc || '__none__'; (byNpc[k]=byNpc[k]||[]).push(ev.id); });
  Object.values(byNpc).forEach(shuffle);
  const picks = [];
  let progress = true;
  while(picks.length<count && progress){
    progress = false;
    for(const k in byNpc){
      if(byNpc[k].length){ picks.push(byNpc[k].pop()); progress = true; if(picks.length>=count) break; }
    }
  }
  return shuffle(picks);
}

function startRun(pid){
  const persona = PERSONAS[pid];
  const hellToggle = document.getElementById('hellToggle');
  const hell = hellToggle ? hellToggle.checked : false;
  const lengthChoice = (document.querySelector('input[name="runLength"]:checked')||{}).value || 'short';
  const drawCount = Math.min(LENGTH_OPTIONS[lengthChoice], availablePool(persona).length);
  clearLog();
  S = freshState(persona, hell);
  S.modifier = pickRunModifier();
  if(S.modifier.apply) S.modifier.apply(S);
  S.runLength = lengthChoice;
  S.drawnIds = drawPool(persona, drawCount);
  S.seq = buildSequence(S.drawnIds.length, QUIZ_COUNT[lengthChoice] || 2);

}

function choose(card, opt, npcKey, sourceId, optIndex){
  card.querySelector('.opt-list').innerHTML = `<div class="chosen-line"><span class="ctag">你的選擇</span><span>${displayLabel(opt)}</span></div>`;
  const finish = (rollLabel, mult, multLabel)=>{
    let effects = effectiveEffects(S.persona.id, sourceId, optIndex, opt.effects);
    if(opt.healthy && S.modifier && S.modifier.id==='no_mercy'){
      const dampened = {};
      Object.keys(effects).forEach(k=>{ dampened[k] = Math.round(effects[k]*0.8); });
      effects = dampened;
    }
    let diceHtml = '';
    if(mult!==undefined){
      const scaled = {};
      Object.keys(effects).forEach(k=>{
        const v = effects[k];
        scaled[k] = v>=0 ? Math.round(v*mult) : -Math.round(Math.abs(v)*mult);
      });
      effects = scaled;
      diceHtml = `<div class="dice-line" style="display:flex;align-items:center;gap:8px;"><img src="assets/images/events/sys_dice.webp" alt="" style="width:36px;height:36px;flex-shrink:0;"> <span>命運骰結果：擲出 <b>${rollLabel}</b> → 效果 ×${multLabel}</span></div>`;
    }
    const tolBefore = npcKey ? S.tol[npcKey] : null;
    const deltas = applyEffects(effects, npcKey);
    const breakpointHtml = (npcKey && tolBefore>0 && S.tol[npcKey]<=0 && !S.brokenNpcs.has(npcKey)) ? npcBreakpointHtml(npcKey) : '';
    const streakLine = (sourceId!=='dilemma') ? streakHtml(optIndex) : '';
    S.history.push({id:sourceId, npc:npcKey, healthy:!!opt.healthy, tolDelta:(effects.tol!==undefined?effects.tol:0)});
    if(opt.setFlag) S.flags.add(opt.setFlag);
    const blind = !!(S.modifier && S.modifier.id==='blind_numbers' && !S.blindRevealed);
    updateGauges(deltas, blind);
    if(diceHtml) card.insertAdjacentHTML('beforeend', diceHtml);
    if(opt.feedback) card.insertAdjacentHTML('beforeend', `<div class="feedback-box">${opt.feedback}</div>`);
    if(blind){

      card.insertAdjacentHTML('beforeend', `<div class="feedback-box" style="font-size:12.5px;color:var(--ink-dim);">🔒 這次的三圍變化先保密，等反差時刻一次揭曉。</div>`);
    } else {
      card.insertAdjacentHTML('beforeend', deltaChipsHtml(S.persona, deltas));
    }
    if(opt.voice){
      const npc = npcKey ? S.persona.npcs.find(n=>n.key===npcKey) : null;
      const who = npc ? npc.name : '現場氣氛';
      card.insertAdjacentHTML('beforeend', `<div class="voice-line"><b>${who}心裡：</b>「${opt.voice}」</div>`);
    }
    if(breakpointHtml) card.insertAdjacentHTML('beforeend', breakpointHtml);
    if(streakLine) card.insertAdjacentHTML('beforeend', streakLine);
    card.insertAdjacentHTML('beforeend', `<div class="continue-row"><button class="btn-primary" onclick="advance()">繼續</button></div>`);
  };
  if(opt.victim){
    const doubleDice = S.modifier && S.modifier.id==='double_dice';
    showVictimWithDice(opt.victim, doubleDice, finish);
  } else {
    finish();
  }
}

function renderQuiz(n){

      card.insertAdjacentHTML('beforeend', `<div class="feedback-box" style="font-size:12.5px;color:var(--ink-dim);">🔒 這次的三圍變化先保密，等反差時刻一次揭曉。</div>`);

  // 目的是讓 A～F 六種一般結局盡量平均分布（各約一到兩成），G 隱藏結局維持約 4~5%，
  // 避免像舊版那樣「隨便玩都拿到同一個結局」。
  if(S.persona.id==='target'){

    if(S.g1<=16) return 'A';
    if(S.toxicity>=12) return 'C';
    if(S.dilemmaChoice==='C'){
      if(ratio>=0.6) return 'G';
      if(ratio>=0.4) return 'F';
      return 'E';
    }
    if(S.dilemmaChoice==='B') return 'B';
    return 'D';
  }
  if(S.persona.id==='staff'){
    // 老陳劇本：g1(信任度)跟其他角色的g1方向相反——從眾／霸凌會讓信任度下降而非上升，門檻判定獨立處理
    // 門檻已依「開發者模式手動覆寫檔」調整過的數值重新校準（覆寫改變了風險/毒性的相對強度，原本的門檻會失準）
    if(S.risk>23) return 'B';
    if(S.toxicity>35) return 'C';
    if(S.g1<30 && S.fear>50 && S.g3>39) return 'A';
    if(ratio>=0.6 && S.dilemmaChoice==='C') return 'G';
    if(ratio>=0.5) return 'F';
    if(ratio>=0.2 && S.dilemmaChoice==='C') return 'E';
    return 'D';
  }
  if(S.persona.id==='migrant'){
    // 阿迪劇本：抱團排外會讓「廠內地位」與「同儕情誼」同步上升（而非此消彼長），A結局門檻獨立處理為兩者皆高
    if(S.risk>29) return 'B';
    if(S.toxicity>25) return 'C';
    if(S.g1>39 && S.g3>49 && S.fear>53) return 'A';
    if(ratio>=0.6 && S.dilemmaChoice==='C') return 'G';
    if(ratio>=0.5) return 'F';
    if(ratio>=0.1 && S.dilemmaChoice==='C') return 'E';
    return 'D';
  }
  if(S.persona.id==='hsu'){
    // 門檻已依「開發者模式手動覆寫檔」調整過的數值重新校準
    if(S.risk>52) return 'B';
    if(S.toxicity>49) return 'C';
    if(S.g1>34 && S.fear>20 && S.g3<38) return 'A';
    if(ratio>=0.6 && S.dilemmaChoice==='C') return 'G';
    if(ratio>=0.5) return 'F';
    if(ratio>=0.1 && S.dilemmaChoice==='C') return 'E';
    return 'D';
  }
  if(S.persona.id==='chair'){
    // 門檻已依「開發者模式手動覆寫檔」調整過的數值重新校準
    if(S.risk>63) return 'B';
    if(S.toxicity>40) return 'C';
    if(S.g1>60 && S.fear>18 && S.g3<43) return 'A';
    if(ratio>=0.6 && S.dilemmaChoice==='C') return 'G';
    if(ratio>=0.5) return 'F';
    if(ratio>=0.1 && S.dilemmaChoice==='C') return 'E';
    return 'D';
  }
  if(S.persona.id==='hrstaff'){
    if(S.risk>48) return 'B';
    if(S.toxicity>25) return 'C';
    if(S.g1>50 && S.fear>69 && S.g3<31) return 'A';
    if(ratio>=0.6 && S.dilemmaChoice==='C') return 'G';
    if(ratio>=0.5) return 'F';
    if(ratio>=0.1 && S.dilemmaChoice==='C') return 'E';
    return 'D';
  }
  // yeh（葉經理）：門檻已依「開發者模式手動覆寫檔」調整過的數值重新校準
  if(S.risk>46) return 'B';
  if(S.toxicity>38) return 'C';
  if(S.g1>49 && S.fear>33 && S.g3<37) return 'A';
  if(ratio>=0.6 && S.dilemmaChoice==='C') return 'G';
  if(ratio>=0.5) return 'F';
  if(ratio>=0.2 && S.dilemmaChoice==='C') return 'E';
  return 'D';
}
function computePersonality(persona){
  const tally={}; persona.npcs.forEach(n=>tally[n.key]=0);
  let unhealthyTotal=0, healthyTotal=0;
  S.history.forEach(h=>{ if(h.healthy) healthyTotal++; else { unhealthyTotal++; if(h.npc && tally[h.npc]!==undefined) tally[h.npc]++; } });
  if(unhealthyTotal===0){
    return healthyTotal>=5? persona.personalityMap.growthHigh : persona.personalityMap.growthLow;
  }
  if(S.brokenNpcs && S.brokenNpcs.size===1){
    const brokenKey = [...S.brokenNpcs][0];
    if(persona.personalityMap[brokenKey]) return persona.personalityMap[brokenKey];
  }
  const top = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0][0];
  return persona.personalityMap[top] || persona.personalityMap.growthLow;
}
function renderEnding(){
  setReckoning(false);
  const persona=S.persona;
  const endId = computeEnding();

  const ending = persona.endings.find(e=>e.id===endId);
  const personality = computePersonality(persona);
  const m = personaMeta(persona.id);

  if(S.hell) m.runsHell = (m.runsHell||0)+1; else m.runsNormal = (m.runsNormal||0)+1;
  if(!m.endings.includes(endId)) m.endings.push(endId);
  if(!m.titles.includes(personality.name)) m.titles.push(personality.name);
  saveMeta(META);
  const newlyUnlocked = checkAchievements(S);

  const galleryCells = persona.endings.map(e=>{
    const got = m.endings.includes(e.id);
    return `<div class="gcell ${got?'':'locked'}"><div class="gname">${got? e.name:'？？？'}</div><div class="gsub">${got?(e.hidden?'隱藏結局':'已收集'):(e.hidden?'隱藏':'未解鎖')}</div></div>`;
  }).join('');

  const endingFamily = ['A','B','C','D'].includes(endId) ? 'dark' : endId==='E' ? 'awaken' : 'positive';

  const endingSymbol = (PERSONA_ENDING_ART[persona.id] && PERSONA_ENDING_ART[persona.id][endingFamily]) || endingFallback[endingFamily];
  appendCard(`

      <h2 class="scene-title" style="font-size:26px;margin-top:8px;">${ending.name}</h2>
    </div>
    <p class="scene-body" style="margin-top:16px;">${ending.text}</p>
  `, endingSymbol);
  appendCard(`
    <p class="eyebrow">人格分析報告</p>
    <h2 class="scene-title" style="font-size:19px;">${personality.name}</h2>
    <p class="scene-body">${personality.desc}</p>
    <p class="scene-body" style="color:var(--ink-dim);font-size:14px;">「你最討厭的那種人，有可能只是另一個時空的你。真正可怕的職場之惡，往往不是刻意的惡意，而是把自己曾經受過的傷，當成理所當然地複製下去。」</p>
    <div class="feedback-box">依職業安全衛生法第6條第2項第3款，雇主對於執行職務因他人行為遭受身體或精神不法侵害，應採取預防必要措施；此義務同樣涵蓋上對下、下對上與平行同事間的不法侵害樣態。若您在現實職場中觀察到類似情境，可透過公司內部申訴管道或職安通報窗口提出反映。</div>
  `);
  appendCard(`
    <p class="eyebrow">結局圖鑑（${persona.name}）　${m.endings.length} / ${persona.endings.length}</p>
    <div class="gallery">${galleryCells}</div>
    <p class="eyebrow" style="margin-top:18px;">稱號牆</p>
    <div class="titlewall">${m.titles.map(t=>`<span class="tchip">${t}</span>`).join('')}</div>
    <p style="font-size:12.5px;color:var(--ink-dim);margin-top:10px;">累計完成 <b class="mono">${m.runsCompleted}</b> 輪${m.runsCompleted>=3?'　·　隱藏支線已解鎖':''}</p>
    ${newlyUnlocked.length? `<div class="feedback-box" style="border-left:3px solid var(--gold);margin-top:14px;"><b>🏆 新解鎖成就：</b>${newlyUnlocked.map(a=>`<div style="margin-top:6px;"><b>${a.name}</b> — ${a.desc}</div>`).join('')}</div>` : ''}
    <div class="continue-row" style="gap:10px;">
      <button class="btn-ghost" onclick="goAchievements()">🏆 成就牆</button>
      <button class="btn-ghost" onclick="goHome()">回到主畫面</button>
      <button class="btn-primary" onclick="goPersonaSelect()">再玩一輪（可換角色）</button>
    </div>
  `);
}
