const LENGTH_OPTIONS = {short:4, long:8};
const QUIZ_COUNT = {short:2, long:3};

function eventAvailable(ev){
  if(!ev.requires) return true;
  if(ev.requires.personaCompleted){
    const m = META[ev.requires.personaCompleted];
    return !!(m && m.runsCompleted>=1);
  }
  return true;
}
function availablePool(persona){ return persona.pool.filter(eventAvailable); }
function drawPool(persona, count){
  const byNpc = {};
  availablePool(persona).forEach(ev=>{ const k = ev.npc || '__none__'; (byNpc[k]=byNpc[k]||[]).push(ev.id); });
  Object.values(byNpc).forEach(shuffle);
  const picks = [];
  let progress = true;
  while(picks.length<count && progress){
    progress = false;
    for(const k in byNpc){
      if(byNpc[k].length){ picks.push(byNpc[k].pop()); progress = true; if(picks.length>=count) break; }
    }
  }
  return shuffle(picks);
}

function startRun(pid){
  const persona = PERSONAS[pid];
  const hellToggle = document.getElementById('hellToggle');
  const hell = hellToggle ? hellToggle.checked : false;
  const lengthChoice = (document.querySelector('input[name="runLength"]:checked')||{}).value || 'short';
  const drawCount = Math.min(LENGTH_OPTIONS[lengthChoice], availablePool(persona).length);
  clearLog();
  S = freshState(persona, hell);
  S.runLength = lengthChoice;
  S.drawnIds = drawPool(persona, drawCount);
  S.seq = buildSequence(S.drawnIds.length, QUIZ_COUNT[lengthChoice] || 2);
  S.step = 1;
  setTopbar(persona);
  goStep();
}
window.startRun = startRun;

function goStep(){
  updateGauges();
  const tag = S.seq[S.step] || 'ending';
  chapterTag.textContent = S.persona.name+' · '+S.persona.dept+' · 案卷 '+String(S.step).padStart(2,'0')+'/'+(S.seq.length-1);
  render(tag);
}
function render(tag){
  if(tag==='intro') return renderIntro();
  if(tag.startsWith('draw')) return renderDraw(parseInt(tag.slice(4)));
  if(tag.startsWith('quiz')) return renderQuiz(parseInt(tag.slice(4)));
  if(tag==='climax') return renderFixed(S.persona.climax,'climax');
  if(tag==='midReveal') return renderMidReveal();
  if(tag==='dilemma') return renderDilemma();
  if(tag==='judgment') return renderJudgment();
  return renderEnding();
}
function renderIntro(){
  const p=S.persona;
  appendCard(`
    <p class="eyebrow">序幕 · ${p.level}上任</p>
    <h2 class="scene-title">恭喜你，${p.name}</h2>
    ${p.introLines.map(s=>`<p class="scene-body">${s}</p>`).join('')}
    <div class="feedback-box"><b>系統提示：</b>【霸凌王養成系統啟動】${S.hell?'　<span style="color:var(--crimson)">☠ HR地獄模式已啟動</span>':''}</div>
    <div class="continue-row"><button class="btn-primary" onclick="advance()">接下這個位置</button></div>
  `);
}
function renderOptions(card, ev, sourceId){
  card.querySelectorAll('.opt-btn').forEach((btn,i)=>{
    btn.onclick=()=>choose(card, ev.options[i], ev.npc!==undefined?ev.npc:null, sourceId, i);
  });
}
function displayLabel(o){ return (S && S.hell && o.hellLabel) ? o.hellLabel : o.label; }
function eventIcon(persona, ev){
  if(ev.icon) return ev.icon;
  const npc = ev.npc && persona.npcs.find(n=>n.key===ev.npc);
  return (npc && npc.icon) ? npc.icon : (persona.orgIcon || '📋');
}
function renderEvent(ev, sourceId){
  const icon = eventIcon(S.persona, ev);
  const kicker = ev.icon==='🎭' ? '黑色幽默插曲' : (ev.icon==='🔗' ? '跨部門客串' : '日常情境');
  const card = appendCard(`
    <p class="eyebrow">${icon} ${kicker} · ${ev.title}</p>
    ${ev.scene.map(s=>`<p class="scene-body">${s}</p>`).join('')}
    <div class="opt-list">${ev.options.map((o,i)=>`<button class="opt-btn" data-i="${i}">${displayLabel(o)}</button>`).join('')}</div>
  `);
  renderOptions(card, ev, sourceId);
}
function renderDraw(idx){
  const id = S.drawnIds[idx];
  const ev = S.persona.pool.find(e=>e.id===id);
  renderEvent(ev, ev.id);
}
function flagCallbackLines(flagIntro){
  if(!flagIntro || !S.flags.size) return [];
  const lines = [];
  Object.keys(flagIntro).forEach(f=>{ if(S.flags.has(f)) lines.push(flagIntro[f]); });
  return lines;
}
function renderFixed(ev, sourceId){
  const extraLines = flagCallbackLines(ev.flagIntro);
  const icon = eventIcon(S.persona, ev);
  const card = appendCard(`
    <p class="eyebrow">${icon} 固定事件 · ${ev.title}</p>
    ${ev.scene.map(s=>`<p class="scene-body">${s}</p>`).join('')}
    ${extraLines.map(s=>`<p class="scene-body" style="color:var(--gold);font-style:italic;">${s}</p>`).join('')}
    <div class="opt-list">${ev.options.map((o,i)=>`<button class="opt-btn" data-i="${i}">${displayLabel(o)}</button>`).join('')}</div>
  `);
  renderOptions(card, ev, sourceId);
}
const CLIMAX_DICE_MULT = {1:1.1,2:1.2,3:1.3,4:1.4,5:1.5,6:1.6};
function choose(card, opt, npcKey, sourceId, optIndex){
  let effects = effectiveEffects(S.persona.id, sourceId, optIndex, opt.effects);
  let diceHtml = '';
  if(opt.victim){
    const roll = 1+Math.floor(Math.random()*6);
    const mult = CLIMAX_DICE_MULT[roll];
    const scaled = {};
    Object.keys(effects).forEach(k=>{
      const v = effects[k];
      scaled[k] = v>=0 ? Math.round(v*mult) : -Math.round(Math.abs(v)*mult);
    });
    effects = scaled;
    diceHtml = `<div class="dice-line">🎲 命運骰：擲出 <b>${roll}</b> → 效果 ×${mult.toFixed(1)}（不確定性加成）</div>`;
  }
  const deltas = applyEffects(effects, npcKey);
  S.history.push({id:sourceId, npc:npcKey, healthy:!!opt.healthy, tolDelta:(effects.tol!==undefined?effects.tol:0)});
  if(opt.setFlag) S.flags.add(opt.setFlag);
  updateGauges(deltas);
  card.querySelector('.opt-list').innerHTML = `<div class="chosen-line"><span class="ctag">你的選擇</span><span>${displayLabel(opt)}</span></div>`;
  const cont = ()=>{
    if(opt.feedback) card.insertAdjacentHTML('beforeend', `<div class="feedback-box">${opt.feedback}</div>`);
    card.insertAdjacentHTML('beforeend', deltaChipsHtml(S.persona, deltas));
    if(opt.voice){
      const npc = npcKey ? S.persona.npcs.find(n=>n.key===npcKey) : null;
      const who = npc ? npc.name : '現場氣氛';
      card.insertAdjacentHTML('beforeend', `<div class="voice-line"><b>${who}心裡：</b>「${opt.voice}」</div>`);
    }
    card.insertAdjacentHTML('beforeend', `<div class="continue-row"><button class="btn-primary" onclick="advance()">繼續</button></div>`);
  };
  if(opt.victim){ showVictim(opt.victim, cont, diceHtml); } else cont();
}
function advance(){ S.step++; goStep(); }
window.advance = advance;

function renderQuiz(n){
  const persona = S.persona;
  const recent = S.history.slice(S.quizMark).filter(h=>!h.healthy);
  S.quizMark = S.history.length;
  const quizLabel = persona.quizLabel || '合理化檢查';
  const quizQuestion = persona.quizQuestion || '你是怎麼看待剛才那幾個決定的？';
  const quizSkipText = persona.quizSkipText || '系統掃描了你最近的決定——這段時間你的選擇相當一致，沒有什麼需要「合理化」的地方。';
  const quizSubmitLine = persona.quizSubmitLine || '系統：嗯，聽起來很合理。';
  if(!recent.length){
    appendCard(`
      <p class="eyebrow">${quizLabel}</p>
      <p class="scene-body" style="color:var(--ink-dim);">${quizSkipText}</p>
      <div class="continue-row"><button class="btn-primary" onclick="advance()">繼續</button></div>
    `);
    return;
  }
  const bank = persona.rationalize;
  const seen = new Set();
  const items = [];
  recent.slice(0,3).forEach(h=>{
    const key = (h.npc && bank[h.npc]) ? h.npc : 'generic';
    const title = getEventTitle(persona,h.id);
    bank[key].forEach(phrase=>{
      const dedupeKey = phrase+'|'+title;
      if(seen.has(dedupeKey)) return;
      seen.add(dedupeKey);
      items.push({phrase, eventTitle:title});
    });
  });
  let gi = 0;
  while(items.length<3 && gi<bank.generic.length*2){
    const phrase = bank.generic[gi % bank.generic.length];
    const dedupeKey = phrase+'|整體心態';
    if(!seen.has(dedupeKey)){ seen.add(dedupeKey); items.push({phrase, eventTitle:'這段時間的整體心態'}); }
    gi++;
  }
  items.splice(6);
  const card = appendCard(`
    <p class="eyebrow">${quizLabel} ${n===1?'I':'II'}</p>
    <h2 class="scene-title">${quizQuestion}</h2>
    <p class="scene-body" style="color:var(--ink-dim);font-size:13.5px;">請勾選符合你想法的敘述（可複選）</p>
    <div class="quiz-list">${items.map((it,i)=>`<label class="quiz-item"><input type="checkbox" data-i="${i}"><span>「${it.phrase}」<br><span style="font-size:11.5px;color:var(--ink-dim);">— 關於：${it.eventTitle}</span></span></label>`).join('')}</div>
    <div class="continue-row"><button class="btn-primary" id="quizSubmit">確定</button></div>
  `);
  document.getElementById('quizSubmit').onclick = ()=>{
    const count = card.querySelectorAll('.quiz-item input:checked').length;
    S.toxicity = clamp(S.toxicity + count*5, 0, 200);
    const gKey = persona.quizGaugeKey || 'g2';
    const gDelta = persona.quizGaugeDelta!==undefined ? persona.quizGaugeDelta : -1;
    const deltas = {};
    if(count>0 && gDelta!==0){
      const before = S[gKey];
      S[gKey] = clamp(S[gKey] + gDelta*count, 0, 100);
      const applied = S[gKey]-before;
      if(applied!==0) deltas[gKey]=applied;
    }
    updateGauges(deltas);
    card.querySelector('#quizSubmit').outerHTML='';
    card.insertAdjacentHTML('beforeend', `<div class="feedback-box">${quizSubmitLine}</div>`);
    card.insertAdjacentHTML('beforeend', deltaChipsHtml(persona, deltas));
    card.insertAdjacentHTML('beforeend', `<div class="continue-row"><button class="btn-primary" onclick="advance()">繼續</button></div>`);
  };
}
function renderMidReveal(){
  const mr = S.persona.midReveal;
  const leftVal = mr.leftCompute ? mr.leftCompute(S) : (mr.leftFromGauge!==undefined ? clamp(S[mr.leftFromGauge],0,100)+'%' : mr.leftFixed);
  const rightVal = mr.rightCompute ? mr.rightCompute(S) : mr.rightFixed;
  appendCard(`
    <p class="eyebrow">固定事件 · 反差時刻</p>
    ${mr.lines.map(s=>`<p class="scene-body">${s}</p>`).join('')}
    <div class="split-stat">
      <div class="split-tile ${mr.leftClass}"><div class="num mono">${leftVal}</div><div class="lbl">${mr.leftLabel}</div></div>
      <div class="split-tile ${mr.rightClass}"><div class="num mono">${rightVal}</div><div class="lbl">${mr.rightLabel}</div></div>
    </div>
    <p class="scene-body" style="color:var(--ink-dim);font-size:13.5px;">${mr.after}</p>
    <div class="continue-row"><button class="btn-primary" onclick="advance()">繼續</button></div>
  `);
}
function getEventTitle(persona, id){
  if(id==='climax') return persona.climax.title;
  const ev = persona.pool.find(e=>e.id===id);
  return ev ? ev.title : id;
}
function renderDilemma(){
  const d = S.persona.dilemma;
  const npcKey = d.npc!==undefined? d.npc : null;
  const extraLines = flagCallbackLines(d.flagIntro);
  const icon = eventIcon(S.persona, d);
  const timelineItems = S.history.filter(h=>!h.healthy).slice(-6);
  const card = appendCard(`
    <p class="eyebrow">${icon} 固定事件 · ${d.title}</p>
    ${d.scene.map(s=>`<p class="scene-body">${s}</p>`).join('')}
    ${extraLines.map(s=>`<p class="scene-body" style="color:var(--gold);font-style:italic;">${s}</p>`).join('')}
    <div class="timeline">${timelineItems.length? timelineItems.map((h,i)=>`<div class="tl-item"><span class="tl-idx mono">${String(i+1).padStart(2,'0')}</span><span>系統調閱到你在「${getEventTitle(S.persona,h.id)}」事件中的選擇紀錄。</span></div>`).join(''):'<div class="tl-item">系統：本輪並未調閱到明確的不當行為紀錄。</div>'}
    <div class="opt-list">${d.options.map((o,i)=>`<button class="opt-btn" data-i="${i}">${displayLabel(o)}</button>`).join('')}</div>
  `);
  card.querySelectorAll('.opt-btn').forEach((btn,i)=>{
    btn.onclick=()=>{
      const opt=d.options[i]; S.dilemmaChoice = opt.healthy?'C':(i===0?'A':'B');
      if(opt.setFlag) S.flags.add(opt.setFlag);
      const effects = effectiveEffects(S.persona.id, 'dilemma', i, opt.effects);
      const deltas = applyEffects(effects, npcKey); updateGauges(deltas);
      card.querySelector('.opt-list').innerHTML = `<div class="chosen-line"><span class="ctag">你的回應</span><span>${displayLabel(opt)}</span></div>`;
      if(opt.feedback) card.insertAdjacentHTML('beforeend', `<div class="feedback-box">${opt.feedback}</div>`);
      card.insertAdjacentHTML('beforeend', deltaChipsHtml(S.persona, deltas));
      card.insertAdjacentHTML('beforeend', `<div class="continue-row"><button class="btn-primary" onclick="advance()">繼續</button></div>`);
    };
  });
}
function getTestimony(persona, npcKey){
  const bank = persona.testimony[npcKey];
  if(bank.flagOverride){
    for(const f in bank.flagOverride){ if(S.flags.has(f)) return bank.flagOverride[f]; }
  }
  const relevant = S.history.filter(h=>h.npc===npcKey && !h.healthy);
  if(!relevant.length) return bank.positive;
  relevant.sort((a,b)=>a.tolDelta-b.tolDelta);
  return bank[relevant[0].id] || bank.positive;
}
function renderJudgment(){
  setReckoning(true);
  const p=S.persona; const hl=p.hiddenLabels;
  const respect = clamp(100-S.fear-S.toxicity/2,0,100);
  const safety = clamp(S.safety,0,100);
  const teamwork = clamp(100-S.fear*0.6,0,100);
  appendCard(`
    <p class="eyebrow">地獄鏡子 · 最終審判</p>
    <h2 class="scene-title">三段證詞</h2>
    ${p.npcs.map(n=>`<div class="testimony"><div class="who">${n.icon||""} ${n.name}（${n.role}）</div><p>${getTestimony(p,n.key)}</p></div>`).join('')}
    <h2 class="scene-title" style="font-size:18px;margin-top:22px;">隱藏數據（全程隱藏至此刻）</h2>
    <div class="hidden-reveal">
      <div class="hr-row"><span class="hr-lbl">${hl.respect}</span><span class="hr-val mono">${Math.round(respect)}</span></div>
      <div class="hr-row"><span class="hr-lbl">${hl.safety}</span><span class="hr-val mono">${Math.round(safety)}</span></div>
      <div class="hr-row"><span class="hr-lbl">${hl.teamwork}</span><span class="hr-val mono">${Math.round(teamwork)}</span></div>
      <div class="hr-row"><span class="hr-lbl">${hl.risk}</span><span class="hr-val mono">${Math.round(S.risk)}</span></div>
    </div>
    <div class="continue-row"><button class="btn-primary" onclick="advance()">接受審判</button></div>
  `);
}
function computeEnding(){
  const total = S.history.length;
  const healthyCount = S.history.filter(h=>h.healthy).length;
  const ratio = total? healthyCount/total : 0;
  if(S.persona.id==='target'){
    // 受害者視角：g1(心理韌性)是「高=好」，跟其他角色的g1(威嚴/掌控力)方向相反，判定邏輯獨立處理
    if(S.g1<=25) return 'A';
    if(S.toxicity>=45) return 'C';
    if(S.dilemmaChoice==='C'){
      if(ratio>=0.85) return 'G';
      if(ratio>=0.45) return 'F';
      return 'E';
    }
    if(S.dilemmaChoice==='B') return 'B';
    return 'D';
  }
  // 門檻整體放寬：加重三圍連動後，數值會比以前更快分化，原本的高標準已經很難踩到，改成較容易觸及的區間
  if(S.risk>65) return 'B';
  if(S.toxicity>60) return 'C';
  if(S.g1>65 && S.fear>50 && S.g3<35) return 'A';
  if(ratio>=0.85 && S.dilemmaChoice==='C') return 'G';
  if(ratio>=0.55) return 'F';
  if(ratio>=0.4 && S.dilemmaChoice==='C') return 'E';
  return 'D';
}
function computePersonality(persona){
  const tally={}; persona.npcs.forEach(n=>tally[n.key]=0);
  let unhealthyTotal=0, healthyTotal=0;
  S.history.forEach(h=>{ if(h.healthy) healthyTotal++; else { unhealthyTotal++; if(h.npc && tally[h.npc]!==undefined) tally[h.npc]++; } });
  if(unhealthyTotal===0){
    return healthyTotal>=5? persona.personalityMap.growthHigh : persona.personalityMap.growthLow;
  }
  const top = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0][0];
  return persona.personalityMap[top] || persona.personalityMap.growthLow;
}
function renderEnding(){
  setReckoning(false);
  const persona=S.persona;
  const endId = computeEnding();
  const ending = persona.endings.find(e=>e.id===endId);
  const personality = computePersonality(persona);
  const m = personaMeta(persona.id);
  m.runsCompleted = (m.runsCompleted||0)+1;
  if(S.hell) m.runsHell = (m.runsHell||0)+1; else m.runsNormal = (m.runsNormal||0)+1;
  if(!m.endings.includes(endId)) m.endings.push(endId);
  if(!m.titles.includes(personality.name)) m.titles.push(personality.name);
  saveMeta(META);

  const galleryCells = persona.endings.map(e=>{
    const got = m.endings.includes(e.id);
    return `<div class="gcell ${got?'':'locked'}"><div class="gname">${got? e.name:'？？？'}</div><div class="gsub">${got?(e.hidden?'隱藏結局':'已收集'):(e.hidden?'隱藏':'未解鎖')}</div></div>`;
  }).join('');

  appendCard(`
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;">結局 ${endId} ${ending.hidden?'· 隱藏結局':''} · ${persona.name} · ${persona.dept}</div>
    <h2 class="scene-title" style="font-size:26px;margin-top:8px;">${ending.name}</h2>
    <p class="scene-body">${ending.text}</p>
  `);
  appendCard(`
    <p class="eyebrow">人格分析報告</p>
    <h2 class="scene-title" style="font-size:19px;">${personality.name}</h2>
    <p class="scene-body">${personality.desc}</p>
    <p class="scene-body" style="color:var(--ink-dim);font-size:14px;">「你最討厭的那種人，有可能只是另一個時空的你。真正可怕的職場之惡，往往不是刻意的惡意，而是把自己曾經受過的傷，當成理所當然地複製下去。」</p>
    <div class="feedback-box">依職業安全衛生法第6條第2項第3款，雇主對於執行職務因他人行為遭受身體或精神不法侵害，應採取預防必要措施；此義務同樣涵蓋上對下、下對上與平行同事間的不法侵害樣態。若您在現實職場中觀察到類似情境，可透過公司內部申訴管道或職安通報窗口提出反映。</div>
  `);
  appendCard(`
    <p class="eyebrow">結局圖鑑（${persona.name}）　${m.endings.length} / ${persona.endings.length}</p>
    <div class="gallery">${galleryCells}</div>
    <p class="eyebrow" style="margin-top:18px;">稱號牆</p>
    <div class="titlewall">${m.titles.map(t=>`<span class="tchip">${t}</span>`).join('')}</div>
    <p style="font-size:12.5px;color:var(--ink-dim);margin-top:10px;">累計完成 <b class="mono">${m.runsCompleted}</b> 輪${m.runsCompleted>=3?'　·　隱藏支線已解鎖':''}</p>
    <div class="continue-row" style="gap:10px;">
      <button class="btn-ghost" onclick="goHome()">回到主畫面</button>
      <button class="btn-primary" onclick="goPersonaSelect()">再玩一輪（可換角色）</button>
    </div>
  `);
}

document.getElementById('footVersion').textContent = `《霸凌王》 正式版 ${CURRENT_VERSION}（本機測試檔・尚未部署）　僅供內部教育訓練測試　資料不會離開你的瀏覽器`;
goHome();
</script>
